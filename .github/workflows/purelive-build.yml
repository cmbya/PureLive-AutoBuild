name: Build Pure Live iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要编译的版本，填写 latest 或 v2.0.23"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  # =========================================================
  # 获取 Pure Live 版本
  # =========================================================
  prepare:
    name: 获取 Pure Live 版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 获取最新版本
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"

          if [ "$INPUT_VERSION" = "latest" ]; then
            TAG=$(gh api repos/liuchuancong/pure_live/releases/latest --jq '.tag_name')
          else
            TAG="$INPUT_VERSION"
          fi

          echo "=========================================="
          echo "准备编译 Pure Live：$TAG"
          echo "=========================================="

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # =========================================================
  # 编译 iOS
  # =========================================================
  build-ios:
    name: 编译 iOS IPA
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      # -----------------------------------------------------
      # 1. 下载源码
      # -----------------------------------------------------
      - name: 下载 Pure Live 源码
        shell: bash
        run: |
          echo "下载版本：${{ needs.prepare.outputs.tag }}"

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      # -----------------------------------------------------
      # 2. 安装 Flutter
      # 不再固定旧版，直接使用最新 Stable
      # -----------------------------------------------------
      - name: 安装最新 Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # -----------------------------------------------------
      # 3. 显示环境
      # -----------------------------------------------------
      - name: 查看 Flutter 和 Dart 版本
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # -----------------------------------------------------
      # 4. 获取项目依赖
      # -----------------------------------------------------
      - name: 获取 Flutter 依赖
        working-directory: source
        run: |
          flutter pub get

      # -----------------------------------------------------
      # 5. 编译 iOS
      # 不签名，后面自己打包 IPA
      # -----------------------------------------------------
      - name: 编译无签名 iOS
        working-directory: source
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # -----------------------------------------------------
      # 6. 检查 Runner.app
      # -----------------------------------------------------
      - name: 检查 iOS 编译结果
        shell: bash
        run: |
          if [ ! -d "source/build/ios/iphoneos/Runner.app" ]; then
            echo "❌ 没有找到 Runner.app"
            exit 1
          fi

          echo "✅ Runner.app 编译成功"

          du -sh source/build/ios/iphoneos/Runner.app

      # -----------------------------------------------------
      # 7. 制作普通无签名 IPA
      # -----------------------------------------------------
      - name: 制作普通 IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          mkdir -p build-normal/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            build-normal/Payload/

          cd build-normal

          zip -qry \
            "../PureLive-${VERSION}-iOS-Unsigned.ipa" \
            Payload

          cd ..

          echo "✅ 普通 IPA 制作完成"

      # -----------------------------------------------------
      # 8. 制作 LiveContainer 专用 IPA
      # -----------------------------------------------------
      - name: 制作 LiveContainer IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          mkdir -p build-livecontainer/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            build-livecontainer/Payload/

          # 删除 App Extension
          # LiveContainer Guest App 暂时不需要它
          rm -rf \
            build-livecontainer/Payload/Runner.app/PlugIns

          cd build-livecontainer

          zip -qry \
            "../PureLive-${VERSION}-iOS-LiveContainer.ipa" \
            Payload

          cd ..

          echo "✅ LiveContainer IPA 制作完成"

      # -----------------------------------------------------
      # 9. 显示 IPA
      # -----------------------------------------------------
      - name: 查看 IPA 文件
        shell: bash
        run: |
          echo "=========================================="
          echo "生成的 IPA："
          echo "=========================================="

          ls -lh *.ipa

      # -----------------------------------------------------
      # 10. 上传
      # -----------------------------------------------------
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-iOS-${{ needs.prepare.outputs.tag }}
          path: |
            PureLive-*-iOS-Unsigned.ipa
            PureLive-*-iOS-LiveContainer.ipa
          retention-days: 7
          if-no-files-found: error
