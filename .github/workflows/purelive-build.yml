name: Build Pure Live iOS + Twitch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pure Live 版本，例如 latest 或 v2.0.23"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: 获取 Pure Live 版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 获取版本
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"

          if [ "$INPUT_VERSION" = "latest" ]; then
            TAG=$(gh api repos/liuchuancong/pure_live/releases/latest --jq '.tag_name')
          else
            TAG="$INPUT_VERSION"
          fi

          echo "Pure Live：$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-ios:
    name: 编译 Pure Live iOS + Twitch
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      # =====================================================
      # 下载源码
      # =====================================================
      - name: 下载 Pure Live
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

          echo "======================================"
          echo "Pure Live：${{ needs.prepare.outputs.tag }}"
          echo "======================================"

      # =====================================================
      # Flutter
      # =====================================================
      - name: 安装 Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: 查看编译环境
        shell: bash
        run: |
          echo "========== Flutter =========="
          flutter --version

          echo ""
          echo "========== Dart =========="
          dart --version

          echo ""
          echo "========== Xcode =========="
          xcodebuild -version

          echo ""
          echo "========== iOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-version

      # =====================================================
      # 关闭 Swift Package Manager
      # =====================================================
      - name: 关闭 Swift Package Manager
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager

      # =====================================================
      # 修复 Pure Live iOS
      # 这部分保持之前已经验证成功的方案
      # =====================================================
      - name: 修复 Pure Live iOS 源码
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          print("======================================")
          print("开始制作 Pure Live iOS 主程序版")
          print("======================================")

          # 1. pubspec.yaml
          pubspec = Path("source/pubspec.yaml")
          text = pubspec.read_text(encoding="utf-8")

          old = "file_picker: ^12.0.0-beta.5"
          new = "file_picker: 12.0.0-beta.5"

          if old in text:
              text = text.replace(old, new)
              print("✅ file_picker 固定为 12.0.0-beta.5")
          elif new in text:
              print("✅ file_picker 已经固定")
          else:
              print("ℹ️ 上游 file_picker 已发生变化")

          new_text = re.sub(
              r'(?m)^\s{2}share_handler:\s*[^\n]+\n',
              '',
              text
          )

          if new_text != text:
              print("✅ 已从 pubspec 删除 share_handler")
          else:
              print("ℹ️ pubspec 中没有 share_handler")

          text = new_text

          if "enable-swift-package-manager: false" not in text:
              marker = (
                  "flutter:\n"
                  "  uses-material-design: true"
              )
              replacement = (
                  "flutter:\n"
                  "  config:\n"
                  "    enable-swift-package-manager: false\n"
                  "  uses-material-design: true"
              )
              if marker in text:
                  text = text.replace(marker, replacement)
                  print("✅ pubspec 已关闭 SwiftPM")

          pubspec.write_text(text, encoding="utf-8")

          # 2. common/index.dart 删除 share_handler export
          index_file = Path("source/lib/common/index.dart")
          text = index_file.read_text(encoding="utf-8")

          old = "export 'package:share_handler/share_handler.dart';\n"

          if old in text:
              text = text.replace(old, '')
              print("✅ 已删除 share_handler Dart export")

          index_file.write_text(text, encoding="utf-8")

          # 3. main.dart 删除 Android ShareHandler 初始化
          main_file = Path("source/lib/main.dart")
          text = main_file.read_text(encoding="utf-8")

          text = re.sub(
              r'^\s*initSharedMediaListener\(\);\s*\n',
              '',
              text,
              flags=re.M
          )

          start_token = "Future<void> initSharedMediaListener() async {"
          start = text.find(start_token)

          if start != -1:
              line_start = text.rfind('\n', 0, start) + 1
              brace_start = text.find('{', start)

              depth = 0
              end = None

              for i in range(brace_start, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("❌ 无法识别 initSharedMediaListener 方法")

              while end < len(text) and text[end] == '\n':
                  end += 1

              text = text[:line_start] + text[end:]
              print("✅ 已删除 Android ShareHandler 监听")
          else:
              print("ℹ️ main.dart 中没有 initSharedMediaListener")

          main_file.write_text(text, encoding="utf-8")

          # 4. Podfile 删除 ShareExtension
          podfile = Path("source/ios/Podfile")
          text = podfile.read_text(encoding="utf-8")

          text = re.sub(
              r'\n\s*# share_handler addition start.*?# share_handler addition end\s*',
              '\n',
              text,
              flags=re.S
          )

          text = re.sub(
              r"\n\s*target 'ShareExtension' do.*?\n\s*end\s*",
              '\n',
              text,
              flags=re.S
          )

          podfile.write_text(text, encoding="utf-8")

          if "target 'ShareExtension'" in text:
              raise SystemExit("❌ Podfile 仍然存在 ShareExtension")

          print("✅ Podfile 已删除 ShareExtension")

          # 5. Runner Xcode 工程只断开 ShareExtension，不删除 Target
          project = Path(
              "source/ios/Runner.xcodeproj/project.pbxproj"
          )

          text = project.read_text(encoding="utf-8")

          phase_match = re.search(
              r'([A-F0-9]{24}) /\* Embed Foundation Extensions \*/ = \{',
              text
          )

          phase_id = phase_match.group(1) if phase_match else None

          dep_id = None
          dep_pattern = re.compile(
              r'([A-F0-9]{24}) /\* PBXTargetDependency \*/ = \{'
              r'(.*?)'
              r'\n\s*\};',
              re.S
          )

          for match in dep_pattern.finditer(text):
              body = match.group(2)
              if "ShareExtension" in body:
                  dep_id = match.group(1)
                  break

          runner_pattern = re.compile(
              r'([A-F0-9]{24}) /\* Runner \*/ = \{'
              r'\n\s*isa = PBXNativeTarget;'
              r'.*?'
              r'\n\s*\};',
              re.S
          )

          runner_match = runner_pattern.search(text)

          if not runner_match:
              raise SystemExit("❌ 找不到 Runner Target")

          runner = runner_match.group(0)

          if phase_id:
              runner = re.sub(
                  rf'^\s*{re.escape(phase_id)} '
                  rf'/\* Embed Foundation Extensions \*/,\s*\n',
                  '',
                  runner,
                  flags=re.M
              )
              print("✅ 已断开 Embed Foundation Extensions")

          if dep_id:
              runner = re.sub(
                  rf'^\s*{re.escape(dep_id)} '
                  rf'/\* PBXTargetDependency \*/,\s*\n',
                  '',
                  runner,
                  flags=re.M
              )
              print("✅ 已断开 Runner → ShareExtension")

          text = (
              text[:runner_match.start()]
              + runner
              + text[runner_match.end():]
          )

          project.write_text(text, encoding="utf-8")

          # 6. 清空 Runner App Group entitlement
          entitlements = Path(
              "source/ios/Runner/Runner.entitlements"
          )

          entitlements.write_text(
              """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          """,
              encoding="utf-8"
          )

          print("✅ 已清空 ShareExtension App Group")

          # 最终验证
          pub = pubspec.read_text(encoding="utf-8")
          idx = index_file.read_text(encoding="utf-8")
          main = main_file.read_text(encoding="utf-8")
          pod = podfile.read_text(encoding="utf-8")

          errors = []

          if re.search(r'(?m)^\s{2}share_handler:', pub):
              errors.append("pubspec 仍存在 share_handler")

          if "package:share_handler/" in idx:
              errors.append("common/index.dart 仍引用 share_handler")

          if "ShareHandler.instance" in main:
              errors.append("main.dart 仍存在 ShareHandler")

          if "target 'ShareExtension'" in pod:
              errors.append("Podfile 仍存在 ShareExtension")

          if errors:
              for error in errors:
                  print("❌ " + error)
              raise SystemExit("iOS 源码修复验证失败")

          print("")
          print("======================================")
          print("✅ Pure Live iOS 主程序版准备完成")
          print("======================================")
          PY

      # =====================================================
      # 加入 Twitch
      #
      # Twitch 的平台请求/播放逻辑来自 simp 的 Twitch 实现，
      # 这里已重新适配 Pure Live 的 LiveSite / LiveRoom 接口。
      # =====================================================
      - name: 加入 Twitch 支持
        shell: bash
        run: |
          echo "======================================"
          echo "添加 TwitchSite"
          echo "======================================"

          mkdir -p source/lib/core/site
          mkdir -p source/lib/core/danmaku

          cat > source/lib/core/danmaku/twitch_danmaku.dart <<'DART'
          import 'dart:convert';

          import 'package:pure_live/common/models/live_message.dart';
          import 'package:pure_live/core/common/web_socket_util.dart';
          import 'package:pure_live/core/interface/live_danmaku.dart';

          class TwitchDanmakuArgs {
            final String roomId;

            TwitchDanmakuArgs({required this.roomId});
          }

          class TwitchDanmaku implements LiveDanmaku {
            @override
            int heartbeatTime = 4 * 60 * 1000;

            bool _connected = false;

            @override
            bool get isConnected => _connected;

            @override
            void markConnected() {
              _connected = true;
            }

            @override
            void markDisconnected() {
              _connected = false;
            }

            @override
            Function(LiveMessage msg)? onMessage;

            @override
            Function(String msg)? onClose;

            @override
            Function()? onReady;

            WebScoketUtils? webScoketUtils;

            @override
            Future start(dynamic args) async {
              if (args is! TwitchDanmakuArgs || args.roomId.isEmpty) {
                onClose?.call('Twitch 弹幕参数错误');
                return;
              }

              webScoketUtils = WebScoketUtils(
                url: 'wss://irc-ws.chat.twitch.tv:443',
                heartBeatTime: heartbeatTime,
                onMessage: decodeMessage,
                onReady: () {
                  markConnected();
                  onReady?.call();
                  joinRoom(args.roomId);
                },
                onHeartBeat: heartbeat,
                onReconnect: () {
                  markDisconnected();
                  onClose?.call('与 Twitch 弹幕服务器断开连接，正在尝试重连');
                },
                onClose: (e) {
                  markDisconnected();
                  onClose?.call('Twitch 弹幕服务器连接失败 $e');
                },
              );

              webScoketUtils?.connect();
            }

            void joinRoom(String roomId) {
              final channel = roomId.toLowerCase();

              webScoketUtils?.sendMessage(
                'CAP REQ :twitch.tv/tags twitch.tv/commands'
              );
              webScoketUtils?.sendMessage('PASS SCHMOOPIIE');
              webScoketUtils?.sendMessage(
                'NICK justinfan${DateTime.now().millisecondsSinceEpoch % 100000}'
              );
              webScoketUtils?.sendMessage('JOIN #$channel');
            }

            @override
            void heartbeat() {
              webScoketUtils?.sendMessage('PING :tmi.twitch.tv');
            }

            @override
            Future stop() async {
              onMessage = null;
              onClose = null;
              markDisconnected();
              webScoketUtils?.close();
            }

            void decodeMessage(dynamic data) {
              try {
                final text = data.toString();

                for (final line in const LineSplitter().convert(text)) {
                  if (line.isEmpty) {
                    continue;
                  }

                  if (line.startsWith('PING')) {
                    webScoketUtils?.sendMessage(
                      line.replaceFirst('PING', 'PONG')
                    );
                    continue;
                  }

                  if (line.contains('PRIVMSG')) {
                    final liveMsg = _parsePrivMsg(line);

                    if (liveMsg != null) {
                      onMessage?.call(liveMsg);
                    }
                  }
                }
              } catch (_) {}
            }

            LiveMessage? _parsePrivMsg(String line) {
              final privIndex = line.indexOf('PRIVMSG');
              final msgStart = line.indexOf(' :', privIndex);

              if (msgStart < 0) {
                return null;
              }

              final tags = _parseTags(line);
              final message = line.substring(msgStart + 2);

              final userName =
                  tags['display-name']?.isNotEmpty == true
                      ? tags['display-name']!
                      : _parseUserName(line);

              final color = _parseColor(tags['color']);

              return LiveMessage(
                type: LiveMessageType.chat,
                userName: userName,
                message: message,
                color: color,
              );
            }

            Map<String, String> _parseTags(String line) {
              if (!line.startsWith('@')) {
                return {};
              }

              final end = line.indexOf(' ');

              if (end <= 1) {
                return {};
              }

              final result = <String, String>{};

              for (final item in line.substring(1, end).split(';')) {
                final index = item.indexOf('=');

                if (index <= 0) {
                  continue;
                }

                result[item.substring(0, index)] =
                    _unescapeTag(item.substring(index + 1));
              }

              return result;
            }

            String _parseUserName(String line) {
              final start = line.indexOf(':');
              final end = line.indexOf('!');

              if (start >= 0 && end > start) {
                return line.substring(start + 1, end);
              }

              return 'Twitch';
            }

            String _unescapeTag(String value) {
              return value
                  .replaceAll(r'\s', ' ')
                  .replaceAll(r'\:', ';')
                  .replaceAll(r'\\', r'\')
                  .replaceAll(r'\r', '\r')
                  .replaceAll(r'\n', '\n');
            }

            LiveMessageColor _parseColor(String? color) {
              if (
                color == null ||
                color.isEmpty ||
                !color.startsWith('#')
              ) {
                return LiveMessageColor.white;
              }

              final value = int.tryParse(
                color.substring(1),
                radix: 16,
              );

              if (value == null) {
                return LiveMessageColor.white;
              }

              return LiveMessageColor.numberToColor(value);
            }
          }
          DART

          cat > source/lib/core/site/twitch_site.dart <<'DART'
          import 'dart:convert';

          import 'package:http/http.dart' as http;
          import 'package:pure_live/common/models/live_area.dart';
          import 'package:pure_live/common/models/live_room.dart';
          import 'package:pure_live/core/danmaku/twitch_danmaku.dart';
          import 'package:pure_live/core/interface/live_danmaku.dart';
          import 'package:pure_live/core/interface/live_site.dart';
          import 'package:pure_live/model/live_category.dart';
          import 'package:pure_live/model/live_play_quality.dart';

          class TwitchSite extends LiveSite {
            static const String platformId = 'twitch';

            @override
            String id = platformId;

            @override
            String name = 'Twitch';

            final String _gqlUrl = 'https://gql.twitch.tv/gql';

            // 与 simp 当前 Twitch 实现保持一致
            final String _clientId =
                'kimne78kx3ncx6brgo4mv6wki5h1ko';

            @override
            LiveDanmaku getDanmaku() => TwitchDanmaku();

            Future<dynamic> _postGql(
              Map<String, dynamic> query,
            ) async {
              final response = await http.post(
                Uri.parse(_gqlUrl),
                headers: {
                  'Client-Id': _clientId,
                  'Content-Type': 'application/json',
                },
                body: jsonEncode([query]),
              );

              if (
                response.statusCode < 200 ||
                response.statusCode >= 300
              ) {
                throw Exception(
                  'Twitch GraphQL HTTP ${response.statusCode}'
                );
              }

              final decoded = jsonDecode(response.body);

              if (
                decoded is! List ||
                decoded.isEmpty
              ) {
                throw Exception('Twitch GraphQL 返回格式异常');
              }

              final first = decoded.first;

              if (first is Map && first['errors'] != null) {
                throw Exception(first['errors'].toString());
              }

              return first['data'];
            }

            Future<Map<String, dynamic>?>
                _getPlaybackAccessToken(
              String roomId,
            ) async {
              final body = {
                'query':
                    'query(\$login: String!) { '
                    'streamPlaybackAccessToken('
                    'channelName: \$login, '
                    'params: {'
                    'platform: "web", '
                    'playerBackend: "mediaplayer", '
                    'playerType: "site"'
                    '}'
                    ') { value signature } '
                    '}',
                'variables': {
                  'login': roomId,
                },
              };

              final response = await http.post(
                Uri.parse(_gqlUrl),
                headers: {
                  'Client-Id': _clientId,
                  'Content-Type': 'application/json',
                },
                body: jsonEncode(body),
              );

              if (
                response.statusCode < 200 ||
                response.statusCode >= 300
              ) {
                throw Exception(
                  'Twitch Token HTTP ${response.statusCode}'
                );
              }

              final jsonRes = jsonDecode(response.body);

              if (jsonRes['errors'] != null) {
                throw Exception(
                  jsonRes['errors'][0]['message'].toString()
                );
              }

              final data =
                  jsonRes['data']?['streamPlaybackAccessToken'];

              if (data is Map<String, dynamic>) {
                return data;
              }

              if (data is Map) {
                return Map<String, dynamic>.from(data);
              }

              return null;
            }

            String _buildMasterPlaylistUrl({
              required String roomId,
              required String sig,
              required String token,
            }) {
              final query = {
                'allow_source': 'true',
                'allow_audio_only': 'true',
                'fast_bread': 'true',
                'p':
                    DateTime.now()
                        .millisecondsSinceEpoch
                        .toString(),
                'sig': sig,
                'token': token,
              };

              return Uri.https(
                'usher.ttvnw.net',
                '/api/channel/hls/$roomId.m3u8',
                query,
              ).toString();
            }

            int _safePageSize(int pageSize) {
              if (pageSize < 1) {
                return 30;
              }

              if (pageSize > 100) {
                return 100;
              }

              return pageSize;
            }

            LiveRoom _streamToRoom(dynamic node) {
              final broadcaster = node['broadcaster'];

              final login =
                  broadcaster?['login']?.toString() ?? '';

              final displayName =
                  broadcaster?['displayName']?.toString() ??
                  login;

              return LiveRoom(
                roomId: login,
                userId: login,
                title: node['title']?.toString() ?? '',
                nick: displayName,
                avatar:
                    broadcaster?['profileImageURL']
                        ?.toString() ??
                    '',
                cover:
                    node['previewImageURL']?.toString() ?? '',
                watching:
                    node['viewersCount']?.toString() ?? '0',
                platform: platformId,
                status: true,
                liveStatus: LiveStatus.live,
                link: 'https://www.twitch.tv/$login',
              );
            }

            @override
            Future<List<LiveRoom>> getRecommendRooms({
              int page = 1,
              int pageSize = 30,
            }) async {
              final first = _safePageSize(pageSize);

              final query = {
                'query':
                    'query { '
                    'streams(first: $first) { '
                    'edges { '
                    'node { '
                    'broadcaster { '
                    'login '
                    'displayName '
                    'profileImageURL(width: 100)'
                    '} '
                    'title '
                    'viewersCount '
                    'previewImageURL(width: 640, height: 360)'
                    '} '
                    '} '
                    '} '
                    '}',
              };

              final data = await _postGql(query);

              final edges =
                  data?['streams']?['edges'] as List? ?? [];

              final result = <LiveRoom>[];

              for (final edge in edges) {
                final node = edge?['node'];

                if (node == null) {
                  continue;
                }

                result.add(_streamToRoom(node));
              }

              return result;
            }

            @override
            Future<List<LiveCategory>> getCategores(
              int page,
              int pageSize,
            ) async {
              final first = _safePageSize(pageSize);

              final query = {
                'query':
                    'query { '
                    'directoriesWithTags(first: $first) { '
                    'edges { '
                    'node { '
                    'id '
                    'name '
                    'avatarURL(width: 144, height: 192)'
                    '} '
                    '} '
                    '} '
                    '}',
              };

              final data = await _postGql(query);

              final children = <LiveArea>[];

              final edges =
                  data?['directoriesWithTags']?['edges']
                      as List? ??
                  [];

              for (final edge in edges) {
                final node = edge?['node'];

                if (node == null) {
                  continue;
                }

                final categoryName =
                    node['name']?.toString() ?? '';

                if (categoryName.isEmpty) {
                  continue;
                }

                children.add(
                  LiveArea(
                    platform: platformId,
                    areaType: 'all',
                    typeName: '热门分类',
                    areaId: categoryName,
                    areaName: categoryName,
                    areaPic:
                        node['avatarURL']?.toString() ?? '',
                  ),
                );
              }

              return [
                LiveCategory(
                  id: 'all',
                  name: '热门分类',
                  children: children,
                ),
              ];
            }

            @override
            Future<List<LiveRoom>> getCategoryRooms(
              LiveArea category, {
              int page = 1,
              int pageSize = 30,
            }) async {
              final first = _safePageSize(pageSize);

              final gameName =
                  (category.areaName?.isNotEmpty ?? false)
                      ? category.areaName!
                      : (category.areaId ?? '');

              if (gameName.isEmpty) {
                return [];
              }

              final query = {
                'query':
                    'query(\$game: String!) { '
                    'game(name: \$game) { '
                    'streams(first: $first) { '
                    'edges { '
                    'node { '
                    'broadcaster { '
                    'login '
                    'displayName '
                    'profileImageURL(width: 100)'
                    '} '
                    'title '
                    'viewersCount '
                    'previewImageURL(width: 640, height: 360)'
                    '} '
                    '} '
                    '} '
                    '} '
                    '}',
                'variables': {
                  'game': gameName,
                },
              };

              final data = await _postGql(query);

              final edges =
                  data?['game']?['streams']?['edges']
                      as List? ??
                  [];

              final result = <LiveRoom>[];

              for (final edge in edges) {
                final node = edge?['node'];

                if (node == null) {
                  continue;
                }

                result.add(_streamToRoom(node));
              }

              return result;
            }

            @override
            Future<bool> getLiveStatus({
              required String platform,
              required String roomId,
            }) async {
              final query = {
                'query':
                    'query(\$login: String!) { '
                    'user(login: \$login) { '
                    'stream { id } '
                    '} '
                    '}',
                'variables': {
                  'login': roomId,
                },
              };

              final data = await _postGql(query);

              return
                  data?['user'] != null &&
                  data?['user']?['stream'] != null;
            }

            @override
            Future<LiveRoom> getRoomDetail({
              required String roomId,
              required String platform,
            }) async {
              final query = {
                'query':
                    'query(\$login: String!) { '
                    'user(login: \$login) { '
                    'displayName '
                    'profileImageURL(width: 100) '
                    'stream { '
                    'title '
                    'viewersCount '
                    'previewImageURL(width: 640, height: 360)'
                    '} '
                    '} '
                    '}',
                'variables': {
                  'login': roomId,
                },
              };

              final data = await _postGql(query);
              final user = data?['user'];

              if (user == null) {
                return LiveRoom(
                  roomId: roomId,
                  userId: roomId,
                  title: '未开播 / 离线',
                  nick: roomId,
                  platform: platformId,
                  status: false,
                  liveStatus: LiveStatus.offline,
                  link: 'https://www.twitch.tv/$roomId',
                  danmakuData: TwitchDanmakuArgs(
                    roomId: roomId,
                  ),
                );
              }

              final stream = user['stream'];
              final isLive = stream != null;

              return LiveRoom(
                roomId: roomId,
                userId: roomId,
                title:
                    isLive
                        ? stream['title']?.toString() ?? ''
                        : '未开播 / 离线',
                nick:
                    user['displayName']?.toString() ??
                    roomId,
                avatar:
                    user['profileImageURL']?.toString() ?? '',
                cover:
                    isLive
                        ? stream['previewImageURL']
                                ?.toString() ??
                            ''
                        : '',
                watching:
                    isLive
                        ? stream['viewersCount']
                                ?.toString() ??
                            '0'
                        : '0',
                platform: platformId,
                status: isLive,
                liveStatus:
                    isLive
                        ? LiveStatus.live
                        : LiveStatus.offline,
                link: 'https://www.twitch.tv/$roomId',
                danmakuData: TwitchDanmakuArgs(
                  roomId: roomId,
                ),
              );
            }

            @override
            Future<List<LivePlayQuality>> getPlayQualites({
              required LiveRoom detail,
            }) async {
              try {
                final roomId = detail.roomId ?? '';

                if (roomId.isEmpty) {
                  return [];
                }

                final tokenData =
                    await _getPlaybackAccessToken(roomId);

                if (tokenData == null) {
                  return _fallbackQualities();
                }

                final masterUrl = _buildMasterPlaylistUrl(
                  roomId: roomId,
                  sig:
                      tokenData['signature']?.toString() ?? '',
                  token:
                      tokenData['value']?.toString() ?? '',
                );

                final response = await http.get(
                  Uri.parse(masterUrl),
                );

                if (
                  response.statusCode < 200 ||
                  response.statusCode >= 300
                ) {
                  return _fallbackQualities(
                    masterUrl: masterUrl,
                  );
                }

                final qualities = _parseM3u8Qualities(
                  response.body,
                  masterUrl,
                );

                if (qualities.isEmpty) {
                  return _fallbackQualities(
                    masterUrl: masterUrl,
                  );
                }

                return qualities;
              } catch (_) {
                return _fallbackQualities();
              }
            }

            @override
            Future<List<String>> getPlayUrls({
              required LiveRoom detail,
              required LivePlayQuality quality,
            }) async {
              try {
                if (
                  quality.data is String &&
                  quality.data.toString().isNotEmpty
                ) {
                  return [
                    quality.data.toString(),
                  ];
                }

                final roomId = detail.roomId ?? '';

                if (roomId.isEmpty) {
                  return [];
                }

                final tokenData =
                    await _getPlaybackAccessToken(roomId);

                if (tokenData == null) {
                  return [];
                }

                final videoUrl = _buildMasterPlaylistUrl(
                  roomId: roomId,
                  sig:
                      tokenData['signature']?.toString() ?? '',
                  token:
                      tokenData['value']?.toString() ?? '',
                );

                return [videoUrl];
              } catch (_) {
                return [];
              }
            }

            List<LivePlayQuality> _parseM3u8Qualities(
              String body,
              String masterUrl,
            ) {
              final result = <LivePlayQuality>[];
              final lines =
                  const LineSplitter().convert(body);

              final baseUri = Uri.parse(masterUrl);

              for (
                var i = 0;
                i < lines.length;
                i++
              ) {
                final line = lines[i].trim();

                if (
                  !line.startsWith(
                    '#EXT-X-STREAM-INF'
                  )
                ) {
                  continue;
                }

                final urlLine =
                    i + 1 < lines.length
                        ? lines[i + 1].trim()
                        : '';

                if (
                  urlLine.isEmpty ||
                  urlLine.startsWith('#')
                ) {
                  continue;
                }

                final resolution =
                    RegExp(
                      r'RESOLUTION=\d+x(\d+)'
                    )
                    .firstMatch(line)
                    ?.group(1);

                final frameRateText =
                    RegExp(
                      r'FRAME-RATE=([0-9.]+)'
                    )
                    .firstMatch(line)
                    ?.group(1);

                final name =
                    RegExp(
                      r'VIDEO="([^"]+)"'
                    )
                    .firstMatch(line)
                    ?.group(1);

                final frameRate =
                    double.tryParse(
                      frameRateText ?? '',
                    );

                final height =
                    int.tryParse(
                      resolution ?? '',
                    ) ??
                    0;

                final url =
                    Uri.parse(urlLine).isAbsolute
                        ? urlLine
                        : baseUri
                            .resolve(urlLine)
                            .toString();

                if (
                  height == 0 &&
                  name == 'audio_only'
                ) {
                  continue;
                }

                var title =
                    name ??
                    (
                      height > 0
                          ? '${height}p'
                          : '自动'
                    );

                if (height > 0) {
                  title =
                      '${height}p'
                      '${frameRate != null && frameRate >= 50 ? '60' : ''}';
                }

                result.add(
                  LivePlayQuality(
                    quality: title,
                    sort:
                        height * 1000 +
                        (frameRate?.round() ?? 0),
                    data: url,
                  ),
                );
              }

              result.sort(
                (a, b) => b.sort.compareTo(a.sort),
              );

              for (
                var i = 0;
                i < result.length;
                i++
              ) {
                final item = result[i];

                if (
                  i == 0 &&
                  !item.quality.contains('来源')
                ) {
                  result[i] = LivePlayQuality(
                    quality:
                        '${item.quality}（来源）',
                    sort: item.sort,
                    data: item.data,
                  );
                }
              }

              return result;
            }

            List<LivePlayQuality> _fallbackQualities({
              String? masterUrl,
            }) {
              return [
                LivePlayQuality(
                  quality: '自动',
                  sort: 10000,
                  data: masterUrl ?? '',
                ),
              ];
            }
          }
          DART

          # ---------------------------------------------------
          # 注册 Twitch 到 Pure Live
          # 暂时使用 Pure 自带 logo，先验证功能；
          # Twitch 功能确认正常后再换正式图标。
          # ---------------------------------------------------
          python3 <<'PY'
          from pathlib import Path

          path = Path("source/lib/core/sites.dart")
          text = path.read_text(encoding="utf-8")

          twitch_import = (
              "import 'package:pure_live/core/site/twitch_site.dart';\n"
          )

          if twitch_import not in text:
              marker = (
                  "import 'package:pure_live/core/site/kuaishou_site.dart';\n"
              )

              if marker not in text:
                  raise SystemExit(
                      "❌ sites.dart 导入结构变化，无法自动加入 Twitch"
                  )

              text = text.replace(
                  marker,
                  marker + twitch_import,
              )

          const_line = (
              '  static const String twitchSite = "twitch";\n'
          )

          if const_line not in text:
              marker = (
                  '  static const String iptvSite = "iptv";\n'
              )

              if marker not in text:
                  raise SystemExit(
                      "❌ sites.dart 常量结构变化，无法自动加入 Twitch"
                  )

              text = text.replace(
                  marker,
                  marker + const_line,
              )

          site_line = (
              '    Site(id: "twitch", name: "Twitch", '
              'logo: "assets/images/logo.png", '
              'liveSite: TwitchSite()),\n'
          )

          if site_line not in text:
              marker = (
                  '    Site(id: "iptv", '
                  'name: i18n("site_iptv"), '
                  'logo: "assets/images/logo.png", '
                  'liveSite: IptvSite()),\n'
              )

              if marker not in text:
                  raise SystemExit(
                      "❌ sites.dart supportSites 结构变化，无法自动加入 Twitch"
                  )

              text = text.replace(
                  marker,
                  site_line + marker,
              )

          path.write_text(text, encoding="utf-8")

          print("✅ Twitch 已注册到 Sites.supportSites")
          PY

          echo ""
          echo "========== Twitch 文件 =========="
          ls -lh \
