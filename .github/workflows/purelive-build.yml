          grep -n "twitch" source/lib/core/sites.dart

      # =====================================================
      # 清理所有旧生成物
      # =====================================================
      - name: 清理 iOS 构建缓存
        shell: bash
        run: |
          cd source

          rm -rf .dart_tool
          rm -rf build

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -f ios/Podfile.lock

          flutter clean

      # =====================================================
      # 获取依赖
      # =====================================================
      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          flutter pub get

          echo ""
          echo "======================================"
          echo "检查依赖"
          echo "======================================"

          echo ""
          echo "file_picker："

          flutter pub deps |
            grep "file_picker" ||
            true

          echo ""
          echo "share_handler："

          if flutter pub deps |
             grep -q "share_handler"; then

            echo "❌ share_handler 仍存在"

            flutter pub deps |
              grep "share_handler"

            exit 1

          else

            echo "✅ iOS 依赖中已无 share_handler"

          fi

      # =====================================================
      # Dart 静态检查
      # 只检查我们新加的 Twitch 文件和 sites.dart
      # =====================================================
      - name: 检查 Twitch Dart 代码
        working-directory: source
        shell: bash
        run: |
          dart analyze \
            lib/core/site/twitch_site.dart \
            lib/core/danmaku/twitch_danmaku.dart \
            lib/core/sites.dart

      # =====================================================
      # CocoaPods
      # =====================================================
      - name: 安装 CocoaPods
        working-directory: source/ios
        shell: bash
        run: |
          echo "CocoaPods："
          pod --version

          echo ""
          echo "开始 pod install..."

          pod install --repo-update

          echo ""
          echo "✅ CocoaPods 安装完成"

      # =====================================================
      # 检查 Xcode 工程
      # =====================================================
      - name: 检查 Xcode 工程
        shell: bash
        run: |
          xcodebuild \
            -project source/ios/Runner.xcodeproj \
            -list

          echo ""
          echo "✅ Xcode 工程可正常读取"

      # =====================================================
      # 编译
      # =====================================================
      - name: 编译无签名 iOS
        working-directory: source
        shell: bash
        run: |
          echo "======================================"
          echo "开始编译 Pure Live iOS + Twitch"
          echo "======================================"

          flutter build ios \
            --release \
            --no-codesign \
            --no-pub

      # =====================================================
      # 检查结果
      # =====================================================
      - name: 检查 Runner.app
        shell: bash
        run: |
          APP="source/build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app 不存在"
            exit 1
          fi

          echo "======================================"
          echo "✅ Runner.app 编译成功"
          echo "======================================"

          du -sh "$APP"

          echo ""

          if [ -d "$APP/PlugIns" ]; then
            echo "发现 PlugIns："
            ls -la "$APP/PlugIns"
          else
            echo "✅ 没有 ShareExtension"
          fi

      # =====================================================
      # 制作 LiveContainer IPA
      # =====================================================
      - name: 制作 IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            ipa/Payload/

          rm -rf \
            ipa/Payload/Runner.app/PlugIns

          cd ipa

          zip -qry \
            "../PureLive-${VERSION}-Twitch-iOS-LiveContainer.ipa" \
            Payload

          cd ..

          echo ""
          echo "======================================"
          echo "✅ IPA 制作成功"
          echo "======================================"

          ls -lh \
            PureLive-*-Twitch-iOS-LiveContainer.ipa

      # =====================================================
      # 上传
      # =====================================================
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Twitch-iOS-${{ needs.prepare.outputs.tag }}
          path: PureLive-*-Twitch-iOS-LiveContainer.ipa
          retention-days: 7
          if-no-files-found: error
