name: Pure Live 每日自动更新 - iOS

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:
    inputs:
      version:
        description: "Pure Live 版本：latest 或指定版本，例如 v2.0.18"
        required: true
        default: "latest"
        type: string

      force_build:
        description: "即使这个版本已经编译过，也强制重新编译"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: purelive-ios-daily-autobuild
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  prepare:
    name: 每日检查 Pure Live 更新
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      marker: ${{ steps.version.outputs.marker }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: 检查最新版本
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # schedule 没有 inputs；定时任务始终检查 latest。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.version }}"
            FORCE="${{ inputs.force_build }}"
          else
            REQUESTED="latest"
            FORCE="false"
          fi

          if [ "$REQUESTED" = "latest" ]; then
            TAG=$(gh api               repos/liuchuancong/pure_live/releases/latest               --jq '.tag_name')
          else
            TAG="$REQUESTED"
          fi

          MARKER="autobuild-ios-${TAG}"

          echo "======================================"
          echo "Pure Live 最新版本：$TAG"
          echo "自动构建标记：$MARKER"
          echo "======================================"

          SHOULD_BUILD="true"

          if [ "$FORCE" != "true" ]; then
            if gh api               "repos/${{ github.repository }}/git/ref/tags/$MARKER"               >/dev/null 2>&1; then

              SHOULD_BUILD="false"

              echo ""
              echo "✅ $TAG 已经成功编译过"
              echo "今天只检测，不重复编译。"
            else
              echo ""
              echo "🆕 检测到尚未编译的新版本：$TAG"
            fi
          else
            echo ""
            echo "⚠️ 手动启用了 force_build：强制重新编译 $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  no-update:
    name: 没有更新
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 今日无需编译
        shell: bash
        run: |
          echo "✅ Pure Live 当前仍是 ${{ needs.prepare.outputs.tag }}"
          echo "✅ 这个版本已经编译完成"
          echo "✅ 今日不启动昂贵的编译 Runner"

  preflight:
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: Twitch + SOOP 完整预检
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下载 AutoBuild 文件
        uses: actions/checkout@v4

      - name: 下载 Pure Live
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      - name: Twitch 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_twitch.py \
            --hash-output twitch_hashes.json

      - name: SOOP 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_soop.py

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 关闭 Swift Package Manager
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager

      - name: 修复 Pure Live iOS
        shell: bash
        run: |
          set -e
          python3 scripts/patch_pure_ios.py source

      - name: 注入 Twitch V4
        shell: bash
        run: |
          set -e

          python3 scripts/patch_twitch.py source \
            --hashes twitch_hashes.json \
            --template patches/twitch_site.dart.tpl

      - name: 注入 SOOP V1
        shell: bash
        run: |
          set -e

          python3 scripts/patch_soop.py source \
            --template patches/soop_site.dart.tpl \
            --auth-page-template patches/soop_account_settings_page.dart.tpl

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          rm -rf .dart_tool build
          rm -rf ios/Pods ios/.symlinks
          rm -f ios/Podfile.lock
          rm -f .flutter-plugins-dependencies

          flutter clean
          flutter pub get

          echo ""
          echo "========== file_picker =========="
          flutter pub deps | grep "file_picker" || true

          echo ""
          echo "========== share_handler =========="

          if flutter pub deps | grep -q "share_handler"; then
            echo "❌ share_handler 仍存在"
            flutter pub deps | grep "share_handler"
            exit 1
          else
            echo "✅ share_handler 已移除"
          fi

      - name: 格式化修改文件
        working-directory: source
        shell: bash
        run: |
          set -e

          dart format \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/modules/settings/pages/soop_account_settings_page.dart \
            lib/modules/settings/pages/platform_settings_page.dart \
            lib/common/services/settings/cookie_settings_controller.dart \
            lib/core/sites.dart \
            lib/common/utils/live_url_tool.dart \
            lib/modules/toolbox/toolbox_controller.dart \
            lib/modules/search/search_controller.dart \
            lib/modules/live_play/controllers/live_play_controller.dart \
            lib/modules/live_play/controllers/player_controller.dart

      - name: Dart 静态检查
        working-directory: source
        shell: bash
        run: |
          set -e

          dart analyze \
            --no-fatal-warnings \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/modules/settings/pages/soop_account_settings_page.dart \
            lib/modules/settings/pages/platform_settings_page.dart \
            lib/common/services/settings/cookie_settings_controller.dart \
            lib/core/sites.dart \
            lib/common/utils/live_url_tool.dart \
            lib/modules/toolbox/toolbox_controller.dart \
            lib/modules/search/search_controller.dart \
            lib/modules/live_play/controllers/live_play_controller.dart \
            lib/modules/live_play/controllers/player_controller.dart

      - name: 准备 Build 源码
        shell: bash
        run: |
          set -e

          rm -rf source/.dart_tool
          rm -rf source/build
          rm -rf source/ios/Pods
          rm -rf source/ios/.symlinks
          rm -f source/ios/Podfile.lock
          rm -f source/.flutter-plugins-dependencies
          rm -rf source/.git

          tar -czf pure-source-v5.tar.gz source

      - name: 上传已通过预检的源码
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.3-Source-${{ needs.prepare.outputs.tag }}
          path: pure-source-v5.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-ios:
    name: 编译 iOS IPA
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    needs:
      - prepare
      - preflight
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: 下载已通过预检的源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.3-Source-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: bash
        run: |
          set -e

          tar -xzf prevalidated/pure-source-v5.tar.gz
          test -f source/lib/core/site/twitch_site.dart
          test -f source/lib/core/site/soop_site.dart

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 查看编译环境
        shell: bash
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 关闭 Swift Package Manager
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e
          flutter clean
          flutter pub get

      - name: 安装 CocoaPods
        working-directory: source/ios
        shell: bash
        run: |
          set -e

          rm -rf Pods .symlinks
          rm -f Podfile.lock
          pod install --repo-update

      - name: 检查 Xcode 工程
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project source/ios/Runner.xcodeproj \
            -list

      - name: 编译无签名 iOS
        working-directory: source
        shell: bash
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign \
            --no-pub

      - name: 检查 Runner.app
        shell: bash
        run: |
          set -e

          APP="source/build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app 不存在"
            exit 1
          fi

          echo "✅ Runner.app 编译成功"
          du -sh "$APP"

      - name: 制作 LiveContainer IPA
        shell: bash
        run: |
          set -e

          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            ipa/Payload/

          rm -rf ipa/Payload/Runner.app/PlugIns

          cd ipa

          zip -qry \
            "../PureLive-${VERSION}-Twitch-SOOP-V5.3-iOS-LiveContainer.ipa" \
            Payload

          cd ..

          ls -lh \
            PureLive-*-Twitch-SOOP-V5.3-iOS-LiveContainer.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.3-iOS-${{ needs.prepare.outputs.tag }}
          path: PureLive-*-Twitch-SOOP-V5.3-iOS-LiveContainer.ipa
          retention-days: 30
          if-no-files-found: error

  mark-built:
    name: 记录已编译版本
    needs:
      - prepare
      - build-ios
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 签出 AutoBuild 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建成功标记 Tag
        shell: bash
        run: |
          set -e

          MARKER="${{ needs.prepare.outputs.marker }}"
          VERSION="${{ needs.prepare.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote             --exit-code             --tags origin             "refs/tags/$MARKER"             >/dev/null 2>&1; then

            echo "ℹ️ 标记已经存在：$MARKER"
            echo "本次属于强制重新编译，不重复创建 Tag."
          else
            git tag               -a "$MARKER"               -m "iOS 自动构建成功 - Pure Live $VERSION"

            git push origin "$MARKER"

            echo "✅ 已创建成功标记：$MARKER"
          fi

          echo ""
          echo "======================================"
          echo "✅ Pure Live $VERSION 自动编译完成"
          echo "✅ 下次每日检测会自动跳过该版本"
          echo "======================================"
