name: Build Pure Live iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要编译的版本，填写 latest 或 v2.0.23"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  # =========================================================
  # 1. 获取 Pure Live 版本
  # =========================================================
  prepare:
    name: 获取 Pure Live 版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 获取 Pure Live 版本
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"

          if [ "$INPUT_VERSION" = "latest" ]; then
            TAG=$(gh api repos/liuchuancong/pure_live/releases/latest --jq '.tag_name')
          else
            TAG="$INPUT_VERSION"
          fi

          echo "=========================================="
          echo "准备编译 Pure Live：$TAG"
          echo "=========================================="

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # =========================================================
  # 2. 编译 iOS
  # =========================================================
  build-ios:
    name: 编译 iOS IPA
    needs: prepare

    # 使用新版 Xcode / iOS SDK
    runs-on: macos-26

    timeout-minutes: 120

    steps:
      # -----------------------------------------------------
      # 1. 查看系统环境
      # -----------------------------------------------------
      - name: 查看 Xcode 和 iOS SDK
        shell: bash
        run: |
          echo "========== macOS =========="
          sw_vers

          echo ""
          echo "========== Xcode =========="
          xcodebuild -version

          echo ""
          echo "========== iOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-version

      # -----------------------------------------------------
      # 2. 下载 Pure Live 官方源码
      # -----------------------------------------------------
      - name: 下载 Pure Live 源码
        shell: bash
        run: |
          echo "=========================================="
          echo "下载版本：${{ needs.prepare.outputs.tag }}"
          echo "=========================================="

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      # -----------------------------------------------------
      # 3. 安装 Flutter Stable
      # -----------------------------------------------------
      - name: 安装 Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # -----------------------------------------------------
      # 4. 查看 Flutter / Dart
      # -----------------------------------------------------
      - name: 查看 Flutter 和 Dart 版本
        shell: bash
        run: |
          echo "========== Flutter =========="
          flutter --version

          echo ""
          echo "========== Dart =========="
          dart --version

          echo ""
          echo "========== Flutter Doctor =========="
          flutter doctor -v

      # -----------------------------------------------------
      # 5. 修复 Pure Live 当前 file_picker 兼容问题
      #
      # 当前源码部分位置：
      #
      # FilePickerResult? result = await FilePicker.pickFiles(
      #
      # 在当前 iOS 构建环境会报：
      #
      # 'FilePickerResult' isn't a type
      #
      # 自动改为：
      #
      # final result = await FilePicker.pickFiles(
      # -----------------------------------------------------
      - name: 修复 FilePickerResult 编译错误
        shell: bash
        run: |
          echo "=========================================="
          echo "修复 FilePickerResult"
          echo "=========================================="

          echo "修改前找到的位置："

          grep -RIn \
            "FilePickerResult? result = await FilePicker.pickFiles" \
            source/lib || true

          find source/lib \
            -type f \
            -name "*.dart" \
            -exec sed -i '' \
            's/FilePickerResult? result = await FilePicker\.pickFiles(/final result = await FilePicker.pickFiles(/g' \
            {} +

          echo ""
          echo "修改后继续检查："

          REMAINING=$(grep -RIl \
            "FilePickerResult? result = await FilePicker.pickFiles" \
            source/lib || true)

          if [ -n "$REMAINING" ]; then
            echo "❌ 仍然存在没有修复的位置："
            echo "$REMAINING"
            exit 1
          fi

          echo "✅ FilePickerResult 修复完成"

          echo ""
          echo "当前 FilePicker.pickFiles 使用位置："

          grep -RIn \
            "final result = await FilePicker.pickFiles" \
            source/lib || true

      # -----------------------------------------------------
      # 6. 获取 Flutter 依赖
      # -----------------------------------------------------
      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          flutter pub get

      # -----------------------------------------------------
      # 7. 清理旧缓存
      # -----------------------------------------------------
      - name: 清理 Flutter 构建缓存
        working-directory: source
        shell: bash
        run: |
          flutter clean
          flutter pub get

      # -----------------------------------------------------
      # 8. 编译无签名 iOS
      # -----------------------------------------------------
      - name: 编译无签名 iOS
        working-directory: source
        shell: bash
        run: |
          echo "=========================================="
          echo "开始编译 Pure Live iOS"
          echo "=========================================="

          flutter build ios \
            --release \
            --no-codesign

      # -----------------------------------------------------
      # 9. 检查 Runner.app
      # -----------------------------------------------------
      - name: 检查 iOS 编译结果
        shell: bash
        run: |
          echo "=========================================="
          echo "检查 Runner.app"
          echo "=========================================="

          if [ ! -d "source/build/ios/iphoneos/Runner.app" ]; then
            echo "❌ 没有找到 Runner.app"
            exit 1
          fi

          echo "✅ Runner.app 编译成功"

          echo ""
          du -sh source/build/ios/iphoneos/Runner.app

      # -----------------------------------------------------
      # 10. 制作普通无签名 IPA
      # -----------------------------------------------------
      - name: 制作普通 IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          echo "=========================================="
          echo "制作普通 IPA"
          echo "版本：$VERSION"
          echo "=========================================="

          rm -rf build-normal
          mkdir -p build-normal/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            build-normal/Payload/

          cd build-normal

          zip -qry \
            "../PureLive-${VERSION}-iOS-Unsigned.ipa" \
            Payload

          cd ..

          echo "✅ 普通 IPA 制作完成"

      # -----------------------------------------------------
      # 11. 制作 LiveContainer 专用 IPA
      #
      # 删除 Guest App 里的 App Extensions
      # -----------------------------------------------------
      - name: 制作 LiveContainer IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          echo "=========================================="
          echo "制作 LiveContainer IPA"
          echo "版本：$VERSION"
          echo "=========================================="

          rm -rf build-livecontainer
          mkdir -p build-livecontainer/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            build-livecontainer/Payload/

          echo "删除 App Extensions..."

          rm -rf \
            build-livecontainer/Payload/Runner.app/PlugIns

          cd build-livecontainer

          zip -qry \
            "../PureLive-${VERSION}-iOS-LiveContainer.ipa" \
            Payload

          cd ..

          echo "✅ LiveContainer IPA 制作完成"

      # -----------------------------------------------------
      # 12. 显示 IPA
      # -----------------------------------------------------
      - name: 查看生成的 IPA
        shell: bash
        run: |
          echo "=========================================="
          echo "最终生成的 IPA"
          echo "=========================================="

          ls -lh *.ipa

          echo ""
          echo "✅ Pure Live iOS 打包完成"

      # -----------------------------------------------------
      # 13. 上传 IPA
      # -----------------------------------------------------
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-iOS-${{ needs.prepare.outputs.tag }}
          path: |
            PureLive-*-iOS-Unsigned.ipa
            PureLive-*-iOS-LiveContainer.ipa
          retention-days: 7
          if-no-files-found: error
