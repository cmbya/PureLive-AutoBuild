name: Build Pure Live iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要编译的版本，填写 latest 或 v2.0.23"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  # =========================================================
  # 1. 获取 Pure Live 最新版本
  # =========================================================
  prepare:
    name: 获取 Pure Live 版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 获取 Pure Live 版本
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"

          if [ "$INPUT_VERSION" = "latest" ]; then
            TAG=$(gh api repos/liuchuancong/pure_live/releases/latest --jq '.tag_name')
          else
            TAG="$INPUT_VERSION"
          fi

          echo "=========================================="
          echo "准备编译 Pure Live：$TAG"
          echo "=========================================="

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # =========================================================
  # 2. 编译 iOS
  # =========================================================
  build-ios:
    name: 编译 iOS IPA
    needs: prepare

    runs-on: macos-26
    timeout-minutes: 120

    steps:
      # -----------------------------------------------------
      # 1. 查看编译环境
      # -----------------------------------------------------
      - name: 查看 Xcode 和 iOS SDK
        shell: bash
        run: |
          echo "========== macOS =========="
          sw_vers

          echo ""
          echo "========== Xcode =========="
          xcodebuild -version

          echo ""
          echo "========== iOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-version

      # -----------------------------------------------------
      # 2. 下载 Pure Live 源码
      # -----------------------------------------------------
      - name: 下载 Pure Live 源码
        shell: bash
        run: |
          echo "=========================================="
          echo "下载 Pure Live：${{ needs.prepare.outputs.tag }}"
          echo "=========================================="

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      # -----------------------------------------------------
      # 3. 修复当前 file_picker 兼容问题
      # -----------------------------------------------------
      - name: 固定 file_picker 兼容版本
        shell: bash
        run: |
          echo "=========================================="
          echo "检查 file_picker"
          echo "=========================================="

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          old = "file_picker: ^12.0.0-beta.5"
          new = "file_picker: 12.0.0-beta.5"

          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print("✅ 已固定 file_picker 12.0.0-beta.5")
          elif new in text:
              print("✅ file_picker 已经固定")
          else:
              print("ℹ️ 上游 file_picker 已经改变，不进行修改")
          PY

          echo ""
          grep -n "file_picker:" source/pubspec.yaml || true

      # -----------------------------------------------------
      # 4. 安装 Flutter
      # -----------------------------------------------------
      - name: 安装 Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # -----------------------------------------------------
      # 5. 查看 Flutter / Dart
      # -----------------------------------------------------
      - name: 查看 Flutter 和 Dart
        shell: bash
        run: |
          echo "========== Flutter =========="
          flutter --version

          echo ""
          echo "========== Dart =========="
          dart --version

          echo ""
          flutter doctor -v

      # -----------------------------------------------------
      # 6. 获取 Flutter 依赖
      # -----------------------------------------------------
      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          flutter clean
          flutter pub get

          echo ""
          echo "========== file_picker =========="
          flutter pub deps | grep -E "file_picker|file_picker_platform" || true

      # -----------------------------------------------------
      # 7. 禁用 ShareExtension
      #
      # 注意：
      # 不再使用 Ruby / xcodeproj 修改工程。
      #
      # 只从 Runner Target 中删除：
      #
      # ① Embed Foundation Extensions
      # ② Runner -> ShareExtension dependency
      #
      # ShareExtension Target 本身保留，不参与 Runner 构建。
      # -----------------------------------------------------
      - name: 禁用 ShareExtension 构建
        shell: bash
        run: |
          echo "=========================================="
          echo "禁用 ShareExtension"
          echo "=========================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "source/ios/Runner.xcodeproj/project.pbxproj"
          )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------
          # 找到 Embed Foundation Extensions Build Phase ID
          # --------------------------------------------------
          phase_match = re.search(
              r'([A-F0-9]{24}) /\* Embed Foundation Extensions \*/ = \{',
              text
          )

          phase_id = (
              phase_match.group(1)
              if phase_match
              else None
          )

          if phase_id:
              print(
                  "✅ 找到 Embed Foundation Extensions："
                  + phase_id
              )
          else:
              print(
                  "ℹ️ 没找到 Embed Foundation Extensions，"
                  "可能上游已经修复"
              )

          # --------------------------------------------------
          # 找到指向 ShareExtension 的 Target Dependency ID
          # --------------------------------------------------
          dep_id = None

          pattern = re.compile(
              r'([A-F0-9]{24}) /\* PBXTargetDependency \*/ = \{'
              r'(.*?)'
              r'\n\s*\};',
              re.S
          )

          for match in pattern.finditer(text):
              body = match.group(2)

              if "/* ShareExtension */" in body:
                  dep_id = match.group(1)
                  break

          if dep_id:
              print(
                  "✅ 找到 ShareExtension Dependency："
                  + dep_id
              )
          else:
              print(
                  "ℹ️ 没找到 ShareExtension Dependency，"
                  "可能上游已经修复"
              )

          # --------------------------------------------------
          # 找到 Runner PBXNativeTarget
          # --------------------------------------------------
          runner_pattern = re.compile(
              r'([A-F0-9]{24}) /\* Runner \*/ = \{'
              r'\n\s*isa = PBXNativeTarget;'
              r'.*?'
              r'\n\s*\};',
              re.S
          )

          runner_match = runner_pattern.search(text)

          if not runner_match:
              raise SystemExit(
                  "❌ 找不到 Runner PBXNativeTarget"
              )

          runner_block = runner_match.group(0)

          print("✅ 找到 Runner Target")

          original_runner = runner_block

          # --------------------------------------------------
          # 从 Runner buildPhases 删除扩展 Embed Phase
          # --------------------------------------------------
          if phase_id:
              runner_block = re.sub(
                  rf'^\s*{re.escape(phase_id)} '
                  rf'/\* Embed Foundation Extensions \*/,\s*\n',
                  '',
                  runner_block,
                  flags=re.M
              )

          # --------------------------------------------------
          # 从 Runner dependencies 删除 ShareExtension
          # --------------------------------------------------
          if dep_id:
              runner_block = re.sub(
                  rf'^\s*{re.escape(dep_id)} '
                  rf'/\* PBXTargetDependency \*/,\s*\n',
                  '',
                  runner_block,
                  flags=re.M
              )

          if runner_block == original_runner:
              print(
                  "ℹ️ Runner 中没有需要删除的引用，"
                  "可能上游已经修复"
              )
          else:
              print(
                  "✅ 已断开 Runner 和 ShareExtension"
              )

          # --------------------------------------------------
          # 写回工程
          #
          # 这里只做普通文本替换。
          # 不使用 xcodeproj 解析或保存工程。
          # --------------------------------------------------
          text = (
              text[:runner_match.start()]
              + runner_block
              + text[runner_match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 再次验证
          # --------------------------------------------------
          check_text = path.read_text(
              encoding="utf-8"
          )

          check_runner = runner_pattern.search(
              check_text
          )

          if not check_runner:
              raise SystemExit(
                  "❌ 修改后 Runner Target 无法识别"
              )

          check_block = check_runner.group(0)

          if phase_id and phase_id in check_block:
              raise SystemExit(
                  "❌ Embed Foundation Extensions "
                  "仍然存在于 Runner"
              )

          if dep_id and dep_id in check_block:
              raise SystemExit(
                  "❌ ShareExtension dependency "
                  "仍然存在于 Runner"
              )

          print("")
          print("==========================================")
          print("✅ ShareExtension 已从 Runner 构建链断开")
          print("==========================================")
          PY

      # -----------------------------------------------------
      # 8. 检查 Xcode 工程
      #
      # 这里只让真正的 Xcode 读取工程，
      # 不再让 Ruby xcodeproj 保存工程。
      # -----------------------------------------------------
      - name: 检查 Xcode 工程
        shell: bash
        run: |
          echo "=========================================="
          echo "检查 Xcode Project"
          echo "=========================================="

          xcodebuild \
            -project source/ios/Runner.xcodeproj \
            -list

          echo ""
          echo "✅ Xcode 可以正常读取工程"

      # -----------------------------------------------------
      # 9. 编译 iOS
      # -----------------------------------------------------
      - name: 编译无签名 iOS
        working-directory: source
        shell: bash
        run: |
          echo "=========================================="
          echo "开始编译 Pure Live iOS"
          echo "=========================================="

          flutter build ios \
            --release \
            --no-codesign

      # -----------------------------------------------------
      # 10. 检查 Runner.app
      # -----------------------------------------------------
      - name: 检查 iOS 编译结果
        shell: bash
        run: |
          APP="source/build/ios/iphoneos/Runner.app"

          echo "=========================================="
          echo "检查 Runner.app"
          echo "=========================================="

          if [ ! -d "$APP" ]; then
            echo "❌ 没有找到 Runner.app"
            exit 1
          fi

          echo "✅ Runner.app 编译成功"

          echo ""
          echo "App 大小："
          du -sh "$APP"

          echo ""
          echo "检查 PlugIns："

          if [ -d "$APP/PlugIns" ]; then
            ls -la "$APP/PlugIns"
          else
            echo "✅ 没有 ShareExtension"
          fi

      # -----------------------------------------------------
      # 11. 制作 LiveContainer IPA
      # -----------------------------------------------------
      - name: 制作 IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          echo "=========================================="
          echo "制作 Pure Live IPA"
          echo "版本：$VERSION"
          echo "=========================================="

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            ipa/Payload/

          # 双保险
          # 即使意外出现扩展，也直接从 IPA 删除
          rm -rf \
            ipa/Payload/Runner.app/PlugIns

          cd ipa

          zip -qry \
            "../PureLive-${VERSION}-iOS-LiveContainer.ipa" \
            Payload

          cd ..

          echo ""
          echo "✅ IPA 制作完成"

      # -----------------------------------------------------
      # 12. 查看 IPA
      # -----------------------------------------------------
      - name: 查看 IPA
        shell: bash
        run: |
          echo "=========================================="
          echo "生成结果"
          echo "=========================================="

          ls -lh PureLive-*.ipa

      # -----------------------------------------------------
      # 13. 上传 IPA
      # -----------------------------------------------------
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-iOS-${{ needs.prepare.outputs.tag }}
          path: PureLive-*-iOS-LiveContainer.ipa
          retention-days: 7
          if-no-files-found: error
