name: Build Pure Live iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要编译的版本，填写 latest 或 v2.0.23"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  # =========================================================
  # 1. 获取 Pure Live 版本
  # =========================================================
  prepare:
    name: 获取 Pure Live 版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 获取 Pure Live 版本
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"

          if [ "$INPUT_VERSION" = "latest" ]; then
            TAG=$(gh api repos/liuchuancong/pure_live/releases/latest --jq '.tag_name')
          else
            TAG="$INPUT_VERSION"
          fi

          echo "=========================================="
          echo "准备编译 Pure Live：$TAG"
          echo "=========================================="

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # =========================================================
  # 2. 编译 iOS IPA
  # =========================================================
  build-ios:
    name: 编译 iOS IPA
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      # -----------------------------------------------------
      # 1. 查看 Xcode / iOS SDK
      # -----------------------------------------------------
      - name: 查看 Xcode 和 iOS SDK
        shell: bash
        run: |
          echo "========== macOS =========="
          sw_vers

          echo ""
          echo "========== Xcode =========="
          xcodebuild -version

          echo ""
          echo "========== iOS SDK =========="
          xcrun --sdk iphoneos --show-sdk-version

      # -----------------------------------------------------
      # 2. 下载 Pure Live 官方源码
      # -----------------------------------------------------
      - name: 下载 Pure Live 源码
        shell: bash
        run: |
          echo "=========================================="
          echo "下载 Pure Live：${{ needs.prepare.outputs.tag }}"
          echo "=========================================="

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      # -----------------------------------------------------
      # 3. 修复 Pure Live v2.0.23 的 file_picker 依赖
      #
      # Pure Live 源码使用的是旧的 FilePickerResult API。
      # ^12.0.0-beta.5 现在可能升级到新的正式版 12.x，
      # 因此这里自动锁定到 12.0.0-beta.5。
      # -----------------------------------------------------
      - name: 固定 file_picker 兼容版本
        shell: bash
        run: |
          echo "=========================================="
          echo "检查 file_picker"
          echo "=========================================="

          grep -n "file_picker:" source/pubspec.yaml || true

          python3 <<'PY'
          from pathlib import Path

          path = Path("source/pubspec.yaml")
          text = path.read_text(encoding="utf-8")

          old = "file_picker: ^12.0.0-beta.5"
          new = "file_picker: 12.0.0-beta.5"

          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print("✅ 已将 file_picker 锁定为 12.0.0-beta.5")
          elif new in text:
              print("✅ file_picker 已经是 12.0.0-beta.5")
          else:
              print("ℹ️ 当前上游已经修改 file_picker 配置，不强制修改")
          PY

          echo ""
          echo "修改后："
          grep -n "file_picker:" source/pubspec.yaml || true

      # -----------------------------------------------------
      # 4. 安装 Flutter Stable
      # -----------------------------------------------------
      - name: 安装 Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # -----------------------------------------------------
      # 5. 查看 Flutter / Dart
      # -----------------------------------------------------
      - name: 查看 Flutter 和 Dart 版本
        shell: bash
        run: |
          echo "========== Flutter =========="
          flutter --version

          echo ""
          echo "========== Dart =========="
          dart --version

          echo ""
          echo "========== Flutter Doctor =========="
          flutter doctor -v

      # -----------------------------------------------------
      # 6. 清理并获取依赖
      # -----------------------------------------------------
      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          flutter clean
          flutter pub get

          echo ""
          echo "=========================================="
          echo "检查最终 file_picker 版本"
          echo "=========================================="

          flutter pub deps | grep -E "file_picker|file_picker_platform" || true

      # -----------------------------------------------------
      # 7. 编译无签名 iOS
      # -----------------------------------------------------
      - name: 编译无签名 iOS
        working-directory: source
        shell: bash
        run: |
          echo "=========================================="
          echo "开始编译 Pure Live iOS"
          echo "=========================================="

          flutter build ios \
            --release \
            --no-codesign

      # -----------------------------------------------------
      # 8. 检查 Runner.app
      # -----------------------------------------------------
      - name: 检查 iOS 编译结果
        shell: bash
        run: |
          echo "=========================================="
          echo "检查 Runner.app"
          echo "=========================================="

          if [ ! -d "source/build/ios/iphoneos/Runner.app" ]; then
            echo "❌ 没有找到 Runner.app"
            exit 1
          fi

          echo "✅ Runner.app 编译成功"

          echo ""
          echo "Runner.app 大小："
          du -sh source/build/ios/iphoneos/Runner.app

      # -----------------------------------------------------
      # 9. 制作普通无签名 IPA
      # -----------------------------------------------------
      - name: 制作普通 IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          echo "=========================================="
          echo "制作普通 IPA"
          echo "版本：$VERSION"
          echo "=========================================="

          rm -rf build-normal
          mkdir -p build-normal/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            build-normal/Payload/

          cd build-normal

          zip -qry \
            "../PureLive-${VERSION}-iOS-Unsigned.ipa" \
            Payload

          cd ..

          echo "✅ 普通 IPA 制作完成"

      # -----------------------------------------------------
      # 10. 制作 LiveContainer 专用 IPA
      #
      # 删除 Pure Live 的 App Extension，
      # 避免 Guest App 扩展影响 LiveContainer。
      # -----------------------------------------------------
      - name: 制作 LiveContainer IPA
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"

          echo "=========================================="
          echo "制作 LiveContainer IPA"
          echo "版本：$VERSION"
          echo "=========================================="

          rm -rf build-livecontainer
          mkdir -p build-livecontainer/Payload

          cp -R \
            source/build/ios/iphoneos/Runner.app \
            build-livecontainer/Payload/

          echo "删除 App Extensions..."

          rm -rf \
            build-livecontainer/Payload/Runner.app/PlugIns

          cd build-livecontainer

          zip -qry \
            "../PureLive-${VERSION}-iOS-LiveContainer.ipa" \
            Payload

          cd ..

          echo "✅ LiveContainer IPA 制作完成"

      # -----------------------------------------------------
      # 11. 查看最终 IPA
      # -----------------------------------------------------
      - name: 查看生成的 IPA
        shell: bash
        run: |
          echo "=========================================="
          echo "最终生成的 IPA"
          echo "=========================================="

          ls -lh *.ipa

          echo ""
          echo "✅ Pure Live iOS 打包全部完成"

      # -----------------------------------------------------
      # 12. 上传 IPA
      # -----------------------------------------------------
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-iOS-${{ needs.prepare.outputs.tag }}
          path: |
            PureLive-*-iOS-Unsigned.ipa
            PureLive-*-iOS-LiveContainer.ipa
          retention-days: 7
          if-no-files-found: error
