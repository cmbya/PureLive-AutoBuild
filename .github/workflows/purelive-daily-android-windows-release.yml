name: Pure Live 每日自动更新 - Android + Windows + 自定义 Twitch SOOP

on:
  schedule:
    - cron: "37 10 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:
    inputs:
      version:
        description: "Pure Live 版本：latest 或指定版本，例如 v2.1.1"
        required: true
        default: "latest"
        type: string

      force_build:
        description: "即使这个版本已经编译过，也强制重新编译"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: purelive-android-windows-official-custom-sites
  cancel-in-progress: false

jobs:
  prepare:
    name: 每日检查 Pure Live 更新
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: 检查上游版本和本仓库 Release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.version }}"
            FORCE="${{ inputs.force_build }}"
          else
            REQUESTED="latest"
            FORCE="false"
          fi

          if [ "$REQUESTED" = "latest" ]; then
            TAG=$(gh api \
              repos/liuchuancong/pure_live/releases/latest \
              --jq '.tag_name')
          else
            TAG="$REQUESTED"
          fi

          RELEASE_TAG="autobuild-aw-${TAG}"

          echo "======================================"
          echo "Pure Live 上游版本：$TAG"
          echo "本仓库 Android+Windows Release：$RELEASE_TAG"
          echo "======================================"

          SHOULD_BUILD="true"

          if [ "$FORCE" != "true" ]; then
            if gh release view \
              "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then

              SHOULD_BUILD="false"

              echo ""
              echo "✅ Release 已存在：$RELEASE_TAG"
              echo "✅ 当前上游版本已经成功编译过"
              echo "✅ 今天不启动 Android / Windows 编译 Runner"
            else
              echo ""
              echo "🆕 当前版本还没有 Android + Windows Release"
            fi
          else
            echo ""
            echo "⚠️ force_build=true"
            echo "⚠️ 强制重新编译 $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  no-update:
    name: 没有更新
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 今日无需编译
        shell: bash
        run: |
          echo "✅ Pure Live 当前仍是 ${{ needs.prepare.outputs.tag }}"
          echo "✅ Android + Windows Release 已存在"
          echo "✅ 今日不重复编译"

  preflight:
    name: 官方源码 + 自定义 Twitch SOOP 预检
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下载 AutoBuild 仓库
        uses: actions/checkout@v4

      - name: 下载 Pure Live 官方源码
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      - name: 检查官方平台结构
        shell: bash
        run: |
          set -e

          test -d source/android
          test -d source/windows
          test -f source/lib/core/sites.dart

          echo "========== 官方 Sites.supportSites =========="
          grep -n -E \
            "twitchSite|soopSite|iptvSite|TwitchSite|SoopSite|IptvSite" \
            source/lib/core/sites.dart \
            || true
          echo "=============================================="

          grep -q "TwitchSite()" source/lib/core/sites.dart
          grep -q "SoopSite()" source/lib/core/sites.dart

          echo "✅ 官方 Android 工程存在"
          echo "✅ 官方 Windows 工程存在"
          echo "✅ 官方源码已经注册 Twitch"
          echo "✅ 官方源码已经注册 SOOP"
          echo "✅ 不修改 Sites.supportSites"

      - name: Twitch 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_twitch.py \
            --hash-output twitch_hashes.json

      - name: SOOP 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_soop.py

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: bash
        run: |
          set -e

          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/.fvmrc")

          if path.exists():
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  print(
                      str(data.get("flutter", "")).strip()
                  )
              except Exception:
                  pass
          PY
          )

          if [ -z "$VERSION" ]; then
            VERSION="3.47.0"
            echo "ℹ️ 未读取到 .fvmrc，回退 Flutter $VERSION"
          else
            echo "✅ 使用官方 .fvmrc Flutter：$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装与官方一致的 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 仅替换自定义 Twitch / SOOP 实现
        shell: bash
        run: |
          set -e

          python3 scripts/extract_custom_sites_v211.py \
            source \
            --hashes twitch_hashes.json \
            --patch-twitch scripts/patch_twitch.py \
            --twitch-template patches/twitch_site.dart.tpl \
            --patch-soop scripts/patch_soop.py \
            --soop-template patches/soop_site.dart.tpl \
            --soop-auth-template patches/soop_account_settings_page.dart.tpl

      - name: 获取官方 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          rm -rf .dart_tool build
          flutter clean
          flutter pub get

      - name: 格式化自定义平台文件
        working-directory: source
        shell: bash
        run: |
          set -e

          dart format \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart

      - name: Dart 快速静态检查
        working-directory: source
        shell: bash
        run: |
          set -e

          dart analyze \
            --no-fatal-warnings \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/core/sites.dart

      - name: 验证 SOOP 关注页封面修复已注入
        shell: bash
        run: |
          set -e

          grep -Fq \
            'https://liveimg.sooplive.com/m/$bno' \
            source/lib/core/site/soop_site.dart

          grep -Fq \
            "item['profile_img']" \
            source/lib/core/site/soop_site.dart

          echo "✅ SOOP 关注页 BNO 封面逻辑已注入"
          echo "✅ SOOP 热门头像 profile_img 逻辑已注入"

      - name: 最终确认平台工程未被自定义补丁改动
        shell: bash
        run: |
          set -e

          echo "✅ 不运行 patch_pure_ios.py"
          echo "✅ 不运行 patch_sites_compat.py"
          echo "✅ 不修改官方 android/"
          echo "✅ 不修改官方 windows/"
          echo "✅ 不修改官方 sites.dart"
          echo "✅ 只替换 TwitchSite / SoopSite"

      - name: 准备跨平台源码包
        shell: bash
        run: |
          set -e

          rm -rf source/.dart_tool
          rm -rf source/build
          rm -rf source/.git

          tar -czf pure-source-official-custom-sites-aw.tar.gz source

          ls -lh pure-source-official-custom-sites-aw.tar.gz

      - name: 上传已预检源码
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Official-AW-CustomSites-${{ needs.prepare.outputs.tag }}
          path: pure-source-official-custom-sites-aw.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: 编译 Android APK
    needs:
      - prepare
      - preflight
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 下载已预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Official-AW-CustomSites-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: bash
        run: |
          set -e

          tar -xzf \
            prevalidated/pure-source-official-custom-sites-aw.tar.gz

          test -d source/android
          test -f source/lib/core/site/twitch_site.dart
          test -f source/lib/core/site/soop_site.dart

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: bash
        run: |
          set -e

          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/.fvmrc")

          if path.exists():
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  print(
                      str(data.get("flutter", "")).strip()
                  )
              except Exception:
                  pass
          PY
          )

          if [ -z "$VERSION" ]; then
            VERSION="3.47.0"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: 安装官方 Flutter 版本
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 准备 Android 签名
        working-directory: source
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE="$PWD/android/purelive-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ]; then

            echo "✅ 使用 GitHub Secrets 固定签名"

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE"
          else
            echo "⚠️ 未设置固定 Android 签名"
            echo "⚠️ 生成临时签名；本次可安装，但下次重新构建可能不能覆盖升级"

            STORE_PASSWORD="PureLiveAutoBuild"
            KEY_PASSWORD="PureLiveAutoBuild"
            KEY_ALIAS="purelive"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PureLive AutoBuild, OU=Personal, O=PureLive, C=CN"
          fi

          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get

      - name: 获取版本号
        id: app_version
        working-directory: source
        shell: bash
        run: |
          set -e

          FULL_VERSION=$(grep '^version:' pubspec.yaml \
            | head -n 1 \
            | sed 's/version:[[:space:]]*//')

          VERSION="${FULL_VERSION%%+*}"

          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Pure Live：$FULL_VERSION"

      - name: 编译 Android APK
        working-directory: source
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "======================================"
          echo "官方 Android 工程 + 自定义 Twitch/SOOP"
          echo "第一次构建"
          echo "======================================"

          set +e

          flutter build apk \
            --release \
            --split-per-abi \
            2>&1 | tee android-first-build.log

          FIRST_EXIT=${PIPESTATUS[0]}

          set -e

          if [ "$FIRST_EXIT" -eq 0 ]; then
            echo "✅ Android 第一次构建成功"
          elif grep -Fq \
            "File modified during build. Build must be rerun." \
            android-first-build.log; then

            echo ""
            echo "⚠️ FFmpegKit 首次准备完成，自动第二次构建"

            flutter build apk \
              --release \
              --split-per-abi
          else
            echo ""
            echo "❌ Android 构建失败"
            exit "$FIRST_EXIT"
          fi

      - name: 整理 Android APK
        working-directory: source
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.app_version.outputs.version }}"

          mkdir -p release-android

          declare -A ABI_NAMES=(
            ["armeabi-v7a"]="arm32-v7a"
            ["arm64-v8a"]="arm64-v8a"
            ["x86_64"]="x86_64"
          )

          COUNT=0

          for APK in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$APK" ] || continue

            BASENAME=$(basename "$APK")
            FOUND=""

            for ABI in "${!ABI_NAMES[@]}"; do
              if [[ "$BASENAME" == *"$ABI"* ]]; then
                FOUND="${ABI_NAMES[$ABI]}"
                break
              fi
            done

            if [ -z "$FOUND" ]; then
              FOUND="universal"
            fi

            cp "$APK" \
              "release-android/PureLive-${VERSION}-Custom-Twitch-SOOP-Android-${FOUND}.apk"

            COUNT=$((COUNT + 1))
          done

          if [ "$COUNT" -lt 1 ]; then
            echo "❌ 没找到 Android APK"
            exit 1
          fi

          ls -lh release-android

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Android-${{ needs.prepare.outputs.tag }}
          path: source/release-android/*.apk
          retention-days: 30
          if-no-files-found: error

  build-windows:
    name: 编译 Windows x64
    needs:
      - prepare
      - preflight
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: 下载已预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Official-AW-CustomSites-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: pwsh
        run: |
          tar -xzf `
            "prevalidated/pure-source-official-custom-sites-aw.tar.gz"

          if (-not (Test-Path "source/windows")) {
            throw "官方 Windows 工程不存在"
          }

          if (-not (Test-Path "source/lib/core/site/twitch_site.dart")) {
            throw "TwitchSite 不存在"
          }

          if (-not (Test-Path "source/lib/core/site/soop_site.dart")) {
            throw "SoopSite 不存在"
          }

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: pwsh
        run: |
          $version = ""

          if (Test-Path "source/.fvmrc") {
            try {
              $data = Get-Content `
                "source/.fvmrc" `
                -Raw |
                ConvertFrom-Json

              $version = "$($data.flutter)".Trim()
            }
            catch {
              $version = ""
            }
          }

          if (-not $version) {
            $version = "3.47.0"
          }

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Flutter：$version"

      - name: 安装官方 Flutter 版本
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 启用 Flutter Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: pwsh
        run: |
          flutter clean
          flutter pub get

      - name: 安装 Fastforge 和 Inno Setup
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            https://github.com/SlotSun/fastforge.git `
            fastforge

          Push-Location fastforge

          dart pub global activate melos
          melos run activate

          Pop-Location

          choco install innosetup `
            -y `
            --no-progress

      - name: 复制 Inno Setup 中文语言包
        working-directory: source
        shell: pwsh
        run: |
          $sourceFile = `
            "windows\packaging\exe\ChineseSimplified.isl"

          $targetFile = `
            "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

          if (Test-Path $sourceFile) {
            Copy-Item `
              $sourceFile `
              $targetFile `
              -Force

            Write-Host "✅ 已复制 Inno Setup 中文语言包"
          }
          else {
            Write-Host "ℹ️ 官方源码没有该语言包，继续打包"
          }

      - name: 获取版本号
        id: app_version
        working-directory: source
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml |
            Where-Object {
              $_ -match '^\s*version:\s*(\S+)'
            } |
            Select-Object -First 1

          if (-not $line) {
            throw "无法读取 pubspec.yaml version"
          }

          $full = (
            $line -replace '^\s*version:\s*', ''
          ).Trim()

          $version = (
            $full -split '\+'
          )[0]

          "full=$full" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Pure Live：$full"

      - name: 打包 Windows EXE + ZIP
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          & fastforge package `
            --platform windows `
            --targets exe,zip `
            --skip-clean `
            2>&1 | Tee-Object `
              -FilePath "windows-first-build.log"

          $firstExit = $LASTEXITCODE

          $ErrorActionPreference = "Stop"

          if ($firstExit -eq 0) {
            Write-Host "✅ Windows 第一次构建成功"
          }
          else {
            $log = Get-Content `
              "windows-first-build.log" `
              -Raw

            if (
              $log -match
              "File modified during build\. Build must be rerun\."
            ) {
              Write-Host "⚠️ FFmpegKit 首次准备完成，自动第二次构建"

              & fastforge package `
                --platform windows `
                --targets exe,zip `
                --skip-clean

              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
            else {
              Write-Host "❌ Windows 构建失败"
              exit $firstExit
            }
          }

      - name: 整理 Windows 文件
        working-directory: source
        shell: pwsh
        run: |
          $VERSION = "${{ steps.app_version.outputs.version }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-windows" |
            Out-Null

          $exe = Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "没有找到 Fastforge 生成的 EXE"
          }

          Copy-Item `
            $exe.FullName `
            "release-windows\PureLive-$VERSION-Custom-Twitch-SOOP-Windows-x64-Setup.exe" `
            -Force

          $zip = Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -Filter "*.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "没有找到 Fastforge 生成的 ZIP"
          }

          Copy-Item `
            $zip.FullName `
            "release-windows\PureLive-$VERSION-Custom-Twitch-SOOP-Windows-x64-Portable.zip" `
            -Force

          Get-ChildItem `
            "release-windows" |
            Format-Table Name, Length -AutoSize

      - name: 上传 Windows EXE + ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Windows-${{ needs.prepare.outputs.tag }}
          path: |
            source/release-windows/*.exe
            source/release-windows/*.zip
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: 发布 Android + Windows GitHub Release
    needs:
      - prepare
      - build-android
      - build-windows
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Android-${{ needs.prepare.outputs.tag }}
          path: release-assets/android

      - name: 下载 Windows EXE + ZIP
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Windows-${{ needs.prepare.outputs.tag }}
          path: release-assets/windows

      - name: 检查 Release Assets
        shell: bash
        run: |
          set -e

          echo "========== Android =========="
          find release-assets/android -type f -print

          echo ""
          echo "========== Windows =========="
          find release-assets/windows -type f -print

          APK_COUNT=$(find release-assets/android -type f -name "*.apk" | wc -l)
          EXE_COUNT=$(find release-assets/windows -type f -name "*.exe" | wc -l)
          ZIP_COUNT=$(find release-assets/windows -type f -name "*.zip" | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "❌ 没有 APK"
            exit 1
          fi

          if [ "$EXE_COUNT" -lt 1 ]; then
            echo "❌ 没有 Windows EXE"
            exit 1
          fi

          if [ "$ZIP_COUNT" -lt 1 ]; then
            echo "❌ 没有 Windows ZIP"
            exit 1
          fi

      - name: 创建或更新 Android + Windows Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          UPSTREAM="${{ needs.prepare.outputs.tag }}"
          RELEASE_TAG="${{ needs.prepare.outputs.release_tag }}"

          cat > release-notes.md <<EOF
          根据上游 liuchuancong/pure_live ${UPSTREAM} 自动构建。

          构建策略：
          - Android：完整沿用上游官方 Android 工程
          - Windows：完整沿用上游官方 Windows 工程和 Fastforge 配置
          - 不修改官方 Sites.supportSites
          - 自定义部分只替换 TwitchSite 与 SoopSite
          - Twitch：使用自己的无弹幕实现
          - SOOP：使用自己的播放/Cookie实现
          - SOOP：关注页补直播封面
          - SOOP：热门页补主播头像
          - Twitch / SOOP 构建前执行真实网络预检

          Android：
          - armeabi-v7a
          - arm64-v8a
          - x86_64

          Windows：
          - x64 Setup EXE
          - x64 Portable ZIP

          这是 GitHub Actions 自动构建的 Pre-release。
          EOF

          mapfile -t ASSETS < <(
            find release-assets \
              -type f \
              \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) \
              -print
          )

          if gh release view \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            gh release upload \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --clobber \
              --repo "${{ github.repository }}"

            gh release edit \
              "$RELEASE_TAG" \
              --title "Pure Live ${UPSTREAM} Android + Windows + 自定义 Twitch / SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --repo "${{ github.repository }}"
          else
            gh release create \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --title "Pure Live ${UPSTREAM} Android + Windows + 自定义 Twitch / SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi

          echo ""
          echo "======================================"
          echo "✅ Android + Windows Release 已发布"
          echo "Release：$RELEASE_TAG"
          echo "======================================"
