name: Pure Live 每日自动更新 - Android + Windows

on:
  schedule:
    - cron: "37 10 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:
    inputs:
      version:
        description: "Pure Live 版本：latest 或指定版本，例如 v2.0.18"
        required: true
        default: "latest"
        type: string

      force_build:
        description: "即使这个版本已经编译过，也强制重新编译"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: purelive-android-windows-daily-autobuild
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  # =========================================================
  # 1. 获取 Pure Live 版本
  # =========================================================
  prepare:
    name: 每日检查 Pure Live 更新
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: 检查上游版本和本仓库 Release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.version }}"
            FORCE="${{ inputs.force_build }}"
          else
            REQUESTED="latest"
            FORCE="false"
          fi

          if [ "$REQUESTED" = "latest" ]; then
            TAG=$(gh api               repos/liuchuancong/pure_live/releases/latest               --jq '.tag_name')
          else
            TAG="$REQUESTED"
          fi

          RELEASE_TAG="autobuild-aw-${TAG}"

          echo "======================================"
          echo "Pure Live 上游版本：$TAG"
          echo "本仓库 Release Tag：$RELEASE_TAG"
          echo "======================================"

          SHOULD_BUILD="true"

          if [ "$FORCE" != "true" ]; then
            if gh release view               "$RELEASE_TAG"               --repo "${{ github.repository }}"               >/dev/null 2>&1; then

              SHOULD_BUILD="false"

              echo ""
              echo "✅ Release 已存在：$RELEASE_TAG"
              echo "✅ 上游没有需要重新编译的新版本"
              echo "✅ 今天不启动编译 Runner"
            else
              echo ""
              echo "🆕 当前版本还没有对应 Release"
              echo "🆕 开始执行预检和编译"
            fi
          else
            echo ""
            echo "⚠️ force_build=true"
            echo "⚠️ 即使 Release 已存在，也会重新编译并覆盖 Assets"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  no-update:
    name: 没有更新
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 今日无需编译
        shell: bash
        run: |
          echo "✅ Pure Live 当前仍是 ${{ needs.prepare.outputs.tag }}"
          echo "✅ 对应 GitHub Release 已存在"
          echo "✅ 今日不启动昂贵的编译 Runner"

  preflight:
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: Twitch + SOOP 完整预检
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下载 AutoBuild 仓库
        uses: actions/checkout@v4

      - name: 下载 Pure Live
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      # -----------------------------------------------------
      # 先检查真实 Twitch / SOOP 网络链路
      # -----------------------------------------------------
      - name: Twitch 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_twitch.py \
            --hash-output twitch_hashes.json

      - name: SOOP 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_soop.py

      # -----------------------------------------------------
      # Dart/Flutter 环境
      # -----------------------------------------------------
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # -----------------------------------------------------
      # Pure Live file_picker 12.x API 兼容
      #
      # 不再硬编码 2/3 个文件。
      # 自动扫描整个 source/lib：
      #
      #   FilePickerResult? result =
      #       await FilePicker.pickFiles(...)
      #
      # 且确实使用 result.files.single.path 的“单文件选择”代码，
      # 自动迁移成：
      #
      #   final result =
      #       await FilePicker.pickFile(...)
      #
      # 这样 IPTV / EPG / 备份恢复以及未来新增的同类位置都不会漏。
      # -----------------------------------------------------
      - name: 修复 Pure file_picker 12.x API
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("source/lib")

          if not root.exists():
              raise SystemExit(
                  "❌ 找不到 source/lib"
              )

          declaration = re.compile(
              r"FilePickerResult\?\s+"
              r"([A-Za-z_][A-Za-z0-9_]*)"
              r"\s*=\s*await\s+"
              r"FilePicker\.pickFiles\("
          )

          patched = []

          for path in root.rglob("*.dart"):
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              matches = list(
                  declaration.finditer(text)
              )

              if not matches:
                  continue

              original = text

              # 倒序替换 declaration，避免位置偏移
              for match in reversed(matches):
                  variable = match.group(1)

                  single_path = (
                      f"{variable}.files.single.path"
                  )

                  # 只有明确是“只取一个文件”的旧代码才自动迁移。
                  # 如果是多文件逻辑，直接报错，避免错误改语义。
                  if single_path not in text:
                      raise SystemExit(
                          "❌ 发现 FilePickerResult，"
                          "但不是已知的单文件写法："
                          f"{path}"
                      )

                  replacement = (
                      f"final {variable} = "
                      "await FilePicker.pickFile("
                  )

                  text = (
                      text[:match.start()]
                      + replacement
                      + text[match.end():]
                  )

                  # file_picker 12.x:
                  # PlatformFile? -> .path
                  text = text.replace(
                      f"{variable}.files.single.path",
                      f"{variable}.path",
                  )

              if text != original:
                  path.write_text(
                      text,
                      encoding="utf-8",
                  )

                  patched.append(
                      str(path)
                  )

                  print(
                      f"✅ 已适配：{path}"
                  )

          if not patched:
              print(
                  "ℹ️ 没发现需要迁移的 "
                  "FilePickerResult 单文件代码"
              )

          # 最终严格扫描。
          # 真正的旧 API 一个都不能剩。
          remaining = []

          for path in root.rglob("*.dart"):
              content = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              if re.search(
                  r"\bFilePickerResult\b",
                  content,
              ):
                  remaining.append(
                      str(path)
                  )

          if remaining:
              print("")
              print(
                  "❌ 仍发现旧 FilePickerResult API："
              )

              for item in remaining:
                  print("  " + item)

              raise SystemExit(1)

          print("")
          print(
              "======================================"
          )
          print(
              "✅ Pure source/lib "
              "已无旧 FilePickerResult API"
          )
          print(
              f"✅ 本次自动适配 {len(patched)} 个文件"
          )
          print(
              "======================================"
          )
          PY

      # -----------------------------------------------------
      # 注入 Twitch + SOOP
      # -----------------------------------------------------
      - name: 兼容 Pure Live 2.1.1 Sites
        shell: bash
        run: |
          set -e

          python3 scripts/patch_sites_compat.py source

      - name: 注入 Twitch V4
        shell: bash
        run: |
          set -e

          python3 scripts/patch_twitch.py source \
            --hashes twitch_hashes.json \
            --template patches/twitch_site.dart.tpl

      - name: 注入 SOOP V5.3 Auth
        shell: bash
        run: |
          set -e

          python3 scripts/patch_soop.py source \
            --template patches/soop_site.dart.tpl \
            --auth-page-template patches/soop_account_settings_page.dart.tpl

      # -----------------------------------------------------
      # Flutter 依赖 + Dart 检查
      # -----------------------------------------------------
      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          rm -rf .dart_tool
          rm -rf build
          rm -f .flutter-plugins-dependencies

          flutter clean
          flutter pub get

          echo ""
          echo "========== file_picker 实际版本 =========="
          flutter pub deps | grep "file_picker" || true

          echo ""
          echo "✅ 不再强制降级 file_picker"
          echo "✅ Pure 源码已适配 file_picker 12.x API"

      - name: 格式化修改文件
        working-directory: source
        shell: bash
        run: |
          set -e

          dart format \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/modules/settings/pages/soop_account_settings_page.dart \
            lib/modules/settings/pages/platform_settings_page.dart \
            lib/common/services/settings/cookie_settings_controller.dart \
            lib/core/sites.dart \
            lib/common/utils/live_url_tool.dart \
            lib/modules/toolbox/toolbox_controller.dart \
            lib/modules/search/search_controller.dart \
            lib/modules/live_play/controllers/live_play_controller.dart \
            lib/modules/live_play/controllers/player_controller.dart

      - name: Dart 静态检查
        working-directory: source
        shell: bash
        run: |
          set -e

          dart analyze \
            --no-fatal-warnings \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/modules/settings/pages/soop_account_settings_page.dart \
            lib/modules/settings/pages/platform_settings_page.dart \
            lib/common/services/settings/cookie_settings_controller.dart \
            lib/core/sites.dart \
            lib/common/utils/live_url_tool.dart \
            lib/modules/toolbox/toolbox_controller.dart \
            lib/modules/search/search_controller.dart \
            lib/modules/live_play/controllers/live_play_controller.dart \
            lib/modules/live_play/controllers/player_controller.dart \
            lib/core/iptv/services/epg_import_manager.dart \
            lib/core/iptv/services/iptv_import_manager.dart \
            lib/plugins/backup_recovery_service.dart

      - name: 准备跨平台源码包
        shell: bash
        run: |
          set -e

          rm -rf source/.dart_tool
          rm -rf source/build
          rm -f source/.flutter-plugins-dependencies
          rm -rf source/.git

          tar -czf pure-source-v5.6.tar.gz source

          ls -lh pure-source-v5.6.tar.gz

      - name: 上传预检源码
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Source-${{ needs.prepare.outputs.tag }}
          path: pure-source-v5.6.tar.gz
          retention-days: 1
          if-no-files-found: error

  # =========================================================
  # 3. Android
  #
  # 优先使用你以后可以设置的固定签名 Secrets：
  #
  # ANDROID_KEYSTORE_BASE64
  # ANDROID_STORE_PASSWORD
  # ANDROID_KEY_PASSWORD
  # ANDROID_KEY_ALIAS
  #
  # 如果没设置，也可以直接编译：
  # 工作流会生成临时签名，APK 能安装。
  # 但下一次重新构建时签名会变化，升级安装时需先卸载旧版。
  # =========================================================
  build-android:
    name: 编译 Android APK
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    needs:
      - prepare
      - preflight

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 下载预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Source-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: bash
        run: |
          set -e

          tar -xzf \
            prevalidated/pure-source-v5.6.tar.gz

          test -f source/lib/core/site/twitch_site.dart
          test -f source/lib/core/site/soop_site.dart

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # -----------------------------------------------------
      # Android 签名
      # -----------------------------------------------------
      - name: 准备 Android 签名
        working-directory: source
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE="$PWD/android/purelive-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ]; then

            echo "✅ 使用 GitHub Secrets 中的固定 Android 签名"

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE"

          else
            echo "⚠️ 未设置固定 Android 签名"
            echo "⚠️ 本次自动生成临时签名，可安装但不适合后续覆盖升级"

            STORE_PASSWORD="PureLiveV53"
            KEY_PASSWORD="PureLiveV53"
            KEY_ALIAS="purelive"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PureLive AutoBuild, OU=Personal, O=PureLive, C=CN"
          fi

          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

          echo "✅ Android key.properties 已创建"

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get

          flutter pub deps | grep "file_picker" || true

      - name: 获取版本号
        id: version
        working-directory: source
        shell: bash
        run: |
          set -e

          FULL_VERSION=$(grep '^version:' pubspec.yaml \
            | head -n 1 \
            | sed 's/version:[[:space:]]*//')

          VERSION="${FULL_VERSION%%+*}"

          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Pure Live version：$FULL_VERSION"

      - name: 编译 Android APK
        working-directory: source
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "======================================"
          echo "Android 第一次构建"
          echo "如果 FFmpegKit 首次下载 AAR 后要求重跑，"
          echo "工作流会自动执行第二次。"
          echo "======================================"

          set +e

          flutter build apk \
            --release \
            --split-per-abi \
            2>&1 | tee android-first-build.log

          FIRST_EXIT=${PIPESTATUS[0]}

          set -e

          if [ "$FIRST_EXIT" -eq 0 ]; then
            echo "✅ Android 第一次构建直接成功"
          elif grep -Fq \
            "File modified during build. Build must be rerun." \
            android-first-build.log; then

            echo ""
            echo "======================================"
            echo "⚠️ FFmpegKit 首次准备完成，需要自动重跑"
            echo "开始 Android 第二次构建"
            echo "======================================"

            flutter build apk \
              --release \
              --split-per-abi

          else
            echo ""
            echo "❌ Android 第一次构建失败，且不是 FFmpegKit 的预期重跑提示"
            exit "$FIRST_EXIT"
          fi

      - name: 整理 Android APK
        working-directory: source
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p release-android

          declare -A ABI_NAMES=(
            ["armeabi-v7a"]="arm32-v7a"
            ["arm64-v8a"]="arm64-v8a"
            ["x86_64"]="x86_64"
          )

          for APK in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$APK" ] || continue

            BASENAME=$(basename "$APK")
            FOUND=""

            for ABI in "${!ABI_NAMES[@]}"; do
              if [[ "$BASENAME" == *"$ABI"* ]]; then
                FOUND="${ABI_NAMES[$ABI]}"
                break
              fi
            done

            if [ -z "$FOUND" ]; then
              FOUND="unknown"
            fi

            cp "$APK" \
              "release-android/PureLive-${VERSION}-Twitch-SOOP-V5.6-Android-${FOUND}.apk"
          done

          echo "========== Android APK =========="
          ls -lh release-android

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Android-${{ needs.prepare.outputs.tag }}
          path: source/release-android/*.apk
          retention-days: 30
          if-no-files-found: error

  # =========================================================
  # 4. Windows
  #
  # 生成：
  # - Windows x64 安装版 EXE
  # - Windows x64 便携 ZIP
  #
  # 不生成 MSIX，因此不需要证书。
  # =========================================================
  build-windows:
    name: 编译 Windows x64
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    needs:
      - prepare
      - preflight

    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 下载预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Source-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: pwsh
        run: |
          tar -xzf `
            "prevalidated/pure-source-v5.6.tar.gz"

          if (-not (Test-Path "source/lib/core/site/twitch_site.dart")) {
            throw "TwitchSite 不存在"
          }

          if (-not (Test-Path "source/lib/core/site/soop_site.dart")) {
            throw "SoopSite 不存在"
          }

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 启用 Flutter Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: pwsh
        run: |
          flutter clean
          flutter pub get

          flutter pub deps |
            Select-String "file_picker"

      # -----------------------------------------------------
      # Fastforge：沿用 Pure Live 官方 Windows 打包方式
      # 只打 exe + zip，不打需要证书的 msix。
      # -----------------------------------------------------
      - name: 安装 Fastforge 和 Inno Setup
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            https://github.com/SlotSun/fastforge.git `
            fastforge

          Push-Location fastforge

          dart pub global activate melos
          melos run activate

          Pop-Location

          choco install innosetup `
            -y `
            --no-progress

      - name: 复制 Inno Setup 中文语言包
        working-directory: source
        shell: pwsh
        run: |
          $sourceFile = `
            "windows\packaging\exe\ChineseSimplified.isl"

          $targetFile = `
            "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

          if (Test-Path $sourceFile) {
            Copy-Item `
              $sourceFile `
              $targetFile `
              -Force

            Write-Host "✅ 已安装 Inno Setup 中文语言包"
          }
          else {
            Write-Host "ℹ️ 未找到中文语言包，继续打包"
          }

      - name: 获取版本号
        id: version
        working-directory: source
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml |
            Where-Object {
              $_ -match '^\s*version:\s*(\S+)'
            } |
            Select-Object -First 1

          if (-not $line) {
            throw "无法读取 pubspec.yaml version"
          }

          $full = ($line -replace '^\s*version:\s*', '').Trim()
          $version = ($full -split '\+')[0]

          "full=$full" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Pure Live version：$full"

      - name: 打包 Windows EXE + ZIP
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "======================================"
          Write-Host "Windows 第一次 Fastforge 构建"
          Write-Host "若 FFmpegKit 首次准备 DLL 后要求重跑，会自动执行第二次"
          Write-Host "======================================"

          & fastforge package `
            --platform windows `
            --targets exe,zip `
            --skip-clean `
            2>&1 | Tee-Object `
              -FilePath "windows-first-build.log"

          $firstExit = $LASTEXITCODE

          $ErrorActionPreference = "Stop"

          if ($firstExit -eq 0) {
            Write-Host "✅ Windows 第一次构建直接成功"
          }
          else {
            $log = Get-Content `
              "windows-first-build.log" `
              -Raw

            if (
              $log -match
              "File modified during build\. Build must be rerun\."
            ) {
              Write-Host ""
              Write-Host "======================================"
              Write-Host "⚠️ FFmpegKit 首次准备完成，需要自动重跑"
              Write-Host "开始 Windows 第二次 Fastforge 构建"
              Write-Host "======================================"

              & fastforge package `
                --platform windows `
                --targets exe,zip `
                --skip-clean

              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
            else {
              Write-Host "❌ Windows 构建失败，且不是 FFmpegKit 的预期重跑提示"
              exit $firstExit
            }
          }

      - name: 整理 Windows 文件
        working-directory: source
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-windows" |
            Out-Null

          Write-Host "========== dist =========="
          Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -File |
            Select-Object FullName, Length

          $exe = Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "没有找到 Fastforge 生成的 EXE"
          }

          Copy-Item `
            $exe.FullName `
            "release-windows\PureLive-$VERSION-Twitch-SOOP-V5.6-Windows-x64-Setup.exe" `
            -Force

          $zip = Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -Filter "*.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "没有找到 Fastforge 生成的 ZIP"
          }

          Copy-Item `
            $zip.FullName `
            "release-windows\PureLive-$VERSION-Twitch-SOOP-V5.6-Windows-x64-Portable.zip" `
            -Force

          Write-Host "========== Windows Release =========="

          Get-ChildItem `
            "release-windows" |
            Format-Table `
              Name, Length `
              -AutoSize

      - name: 上传 Windows EXE + ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Windows-${{ needs.prepare.outputs.tag }}
          path: |
            source/release-windows/*.exe
            source/release-windows/*.zip
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: 发布 Android + Windows GitHub Release
    needs:
      - prepare
      - build-android
      - build-windows
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Android-${{ needs.prepare.outputs.tag }}
          path: release-assets/android

      - name: 下载 Windows EXE + ZIP
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Twitch-SOOP-V5.6-Windows-${{ needs.prepare.outputs.tag }}
          path: release-assets/windows

      - name: 检查 Release Assets
        shell: bash
        run: |
          set -e

          echo "========== Android =========="
          find release-assets/android -type f -print

          echo ""
          echo "========== Windows =========="
          find release-assets/windows -type f -print

          APK_COUNT=$(find release-assets/android -type f -name "*.apk" | wc -l)
          EXE_COUNT=$(find release-assets/windows -type f -name "*.exe" | wc -l)
          ZIP_COUNT=$(find release-assets/windows -type f -name "*.zip" | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "❌ 没找到 Android APK"
            exit 1
          fi

          if [ "$EXE_COUNT" -lt 1 ]; then
            echo "❌ 没找到 Windows EXE"
            exit 1
          fi

          if [ "$ZIP_COUNT" -lt 1 ]; then
            echo "❌ 没找到 Windows ZIP"
            exit 1
          fi

      - name: 创建或更新 Android + Windows Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          UPSTREAM="${{ needs.prepare.outputs.tag }}"
          RELEASE_TAG="${{ needs.prepare.outputs.release_tag }}"

          cat > release-notes.md <<EOF
          根据上游 liuchuancong/pure_live ${UPSTREAM} 自动构建。

          - 上游：liuchuancong/pure_live
          - 上游版本：${UPSTREAM}
          - Android：APK（按 ABI 分包）
          - Windows：x64 Setup EXE + Portable ZIP
          - 扩展：Twitch + SOOP
          - SOOP：支持账号登录 / Cookie
          - Twitch / SOOP：构建前均经过真实网络预检

          这是 GitHub Actions 自动构建的 Pre-release。
          EOF

          mapfile -t ASSETS < <(
            find release-assets \
              -type f \
              \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) \
              -print
          )

          if gh release view \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            echo "ℹ️ Release 已存在，覆盖上传新的 Assets"

            gh release upload \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --clobber \
              --repo "${{ github.repository }}"

            gh release edit \
              "$RELEASE_TAG" \
              --title "Pure Live ${UPSTREAM} Android + Windows + Twitch + SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --repo "${{ github.repository }}"
          else
            echo "🆕 创建新的 Android + Windows Release"

            gh release create \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --title "Pure Live ${UPSTREAM} Android + Windows + Twitch + SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi

          echo ""
          echo "======================================"
          echo "✅ Android + Windows Release 已发布"
          echo "Release：$RELEASE_TAG"
          echo "======================================"
