name: Pure Live 每日自动更新 - Android + Windows + 自定义 Twitch SOOP

on:
  schedule:
    - cron: "37 10 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:
    inputs:
      version:
        description: "Pure Live 版本：latest 或指定版本，例如 v2.1.1"
        required: true
        default: "latest"
        type: string

      build_target:
        description: "手动编译平台"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows

      force_build:
        description: "即使目标平台已经编译过，也强制重新编译"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: purelive-android-windows-official-custom-sites
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查版本与目标平台
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}
      target: ${{ steps.version.outputs.target }}

    steps:
      - name: 检查上游版本和已有 Assets
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.version }}"
            FORCE="${{ inputs.force_build }}"
            TARGET="${{ inputs.build_target }}"
          else
            REQUESTED="latest"
            FORCE="false"
            TARGET="all"
          fi

          case "$TARGET" in
            all|android|windows)
              ;;
            *)
              echo "❌ 未知 build_target：$TARGET"
              exit 1
              ;;
          esac

          if [ "$REQUESTED" = "latest" ]; then
            TAG=$(gh api \
              repos/liuchuancong/pure_live/releases/latest \
              --jq '.tag_name')
          else
            TAG="$REQUESTED"
          fi

          RELEASE_TAG="autobuild-aw-${TAG}"

          echo "======================================"
          echo "Pure Live：$TAG"
          echo "目标平台：$TARGET"
          echo "Release：$RELEASE_TAG"
          echo "======================================"

          SHOULD_BUILD="true"

          if [ "$FORCE" != "true" ]; then
            ASSETS=""

            if gh release view \
              "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then

              ASSETS=$(gh release view \
                "$RELEASE_TAG" \
                --repo "${{ github.repository }}" \
                --json assets \
                --jq '.assets[].name' \
                || true)
            fi

            APK_COUNT=$(printf '%s\n' "$ASSETS" \
              | grep -Eci '\.apk$' || true)

            EXE_COUNT=$(printf '%s\n' "$ASSETS" \
              | grep -Eci '\.exe$' || true)

            ZIP_COUNT=$(printf '%s\n' "$ASSETS" \
              | grep -Eci '\.zip$' || true)

            echo "已有 APK：$APK_COUNT"
            echo "已有 EXE：$EXE_COUNT"
            echo "已有 ZIP：$ZIP_COUNT"

            case "$TARGET" in
              android)
                if [ "$APK_COUNT" -ge 1 ]; then
                  SHOULD_BUILD="false"
                fi
                ;;
              windows)
                if [ "$EXE_COUNT" -ge 1 ] && [ "$ZIP_COUNT" -ge 1 ]; then
                  SHOULD_BUILD="false"
                fi
                ;;
              all)
                if [ "$APK_COUNT" -ge 1 ] && \
                   [ "$EXE_COUNT" -ge 1 ] && \
                   [ "$ZIP_COUNT" -ge 1 ]; then
                  SHOULD_BUILD="false"
                fi
                ;;
            esac

            if [ "$SHOULD_BUILD" = "false" ]; then
              echo ""
              echo "✅ 目标平台对应 Assets 已存在"
              echo "✅ 本次不重复编译"
            else
              echo ""
              echo "🆕 目标平台 Assets 不完整，开始编译"
            fi
          else
            echo ""
            echo "⚠️ force_build=true"
            echo "⚠️ 强制重新编译：$TARGET"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

  no-update:
    name: 无需编译
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 当前目标已经完成
        shell: bash
        run: |
          echo "✅ Pure Live：${{ needs.prepare.outputs.tag }}"
          echo "✅ 目标平台：${{ needs.prepare.outputs.target }}"
          echo "✅ 对应 Release Assets 已存在"

  preflight:
    name: 官方源码 + 自定义 Twitch SOOP 预检
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下载 AutoBuild 仓库
        uses: actions/checkout@v4

      - name: 下载 Pure Live 官方源码
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      - name: 检查官方平台结构
        shell: bash
        run: |
          set -e

          test -d source/android
          test -d source/windows
          test -f source/lib/core/sites.dart

          grep -q "TwitchSite()" source/lib/core/sites.dart
          grep -q "SoopSite()" source/lib/core/sites.dart

          echo "✅ 官方 Android 工程存在"
          echo "✅ 官方 Windows 工程存在"
          echo "✅ 官方已经注册 Twitch / SOOP"
          echo "✅ 不修改 Sites.supportSites"

      - name: Twitch 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_twitch.py \
            --hash-output twitch_hashes.json

      - name: SOOP 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_soop.py

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: bash
        run: |
          set -e

          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/.fvmrc")

          if path.exists():
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  print(
                      str(data.get("flutter", "")).strip()
                  )
              except Exception:
                  pass
          PY
          )

          if [ -z "$VERSION" ]; then
            VERSION="3.47.0"
            echo "ℹ️ 未读取到 .fvmrc，回退 Flutter $VERSION"
          else
            echo "✅ 官方 Flutter：$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装官方 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 仅替换自定义 Twitch / SOOP 实现
        shell: bash
        run: |
          set -e

          python3 scripts/extract_custom_sites_v211.py \
            source \
            --hashes twitch_hashes.json \
            --patch-twitch scripts/patch_twitch.py \
            --twitch-template patches/twitch_site.dart.tpl \
            --patch-soop scripts/patch_soop.py \
            --soop-template patches/soop_site.dart.tpl \
            --soop-auth-template patches/soop_account_settings_page.dart.tpl

      - name: 强制验证 SOOP 关注页封面代码
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/lib/core/site/soop_site.dart")
          text = path.read_text(encoding="utf-8")

          start = text.find("Future<LiveRoom> getRoomDetail")
          if start < 0:
              raise SystemExit("❌ 找不到 SOOP getRoomDetail()")

          end = text.find("@override", start + 20)
          if end < 0:
              end = min(len(text), start + 5000)

          block = text[start:end]

          checks = {
              "V2 marker":
                  "CMBYA_SOOP_FOLLOW_COVER_V2" in block,
              "BNO cover":
                  "https://liveimg.sooplive.com/m/$bno" in block,
              "LiveRoom cover":
                  "cover: cover," in block,
              "旧空封面已删除":
                  "cover: ''," not in block,
          }

          for name, ok in checks.items():
              print(("✅" if ok else "❌"), name)

          if not all(checks.values()):
              print(block)
              raise SystemExit(
                  "❌ SOOP 关注页封面 V2 没有进入最终源码"
              )

          print("✅ SOOP 关注页封面 V2 已进入最终源码")
          PY

      - name: 获取官方 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          rm -rf .dart_tool build
          flutter clean
          flutter pub get

      - name: 格式化自定义平台文件
        working-directory: source
        shell: bash
        run: |
          set -e

          dart format \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart

      - name: Dart 快速静态检查
        working-directory: source
        shell: bash
        run: |
          set -e

          dart analyze \
            --no-fatal-warnings \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/core/sites.dart

      - name: 准备跨平台源码包
        shell: bash
        run: |
          set -e

          rm -rf source/.dart_tool
          rm -rf source/build
          rm -rf source/.git

          tar -czf \
            pure-source-official-custom-sites-aw.tar.gz \
            source

      - name: 上传已预检源码
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Official-AW-CustomSites-${{ needs.prepare.outputs.tag }}
          path: pure-source-official-custom-sites-aw.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-android:
    name: 编译 Android APK
    needs:
      - prepare
      - preflight
    if: >-
      ${{
        needs.prepare.outputs.should_build == 'true' &&
        (
          needs.prepare.outputs.target == 'all' ||
          needs.prepare.outputs.target == 'android'
        )
      }}
    # Pure Live 官方 release workflow 的 Android 构建使用 macOS。
    # 使用相同 Runner，减少 Linux Android Lint / 原生插件差异。
    runs-on: macos-latest
    timeout-minutes: 150

    steps:
      - name: 下载已预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Official-AW-CustomSites-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: bash
        run: |
          set -e

          tar -xzf \
            prevalidated/pure-source-official-custom-sites-aw.tar.gz

          test -d source/android
          test -f source/lib/core/site/twitch_site.dart
          test -f source/lib/core/site/soop_site.dart

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: bash
        run: |
          set -e

          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/.fvmrc")

          if path.exists():
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  print(
                      str(data.get("flutter", "")).strip()
                  )
              except Exception:
                  pass
          PY
          )

          if [ -z "$VERSION" ]; then
            VERSION="3.47.0"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: 安装官方 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 查看 Android 构建环境
        shell: bash
        run: |
          set -e

          flutter --version
          java -version
          sw_vers

          echo ""
          echo "========== 官方 app lint 配置 =========="
          grep -n -A8 -B2 \
            'lint {' \
            source/android/app/build.gradle.kts \
            || true

      - name: 准备 Android 签名
        working-directory: source
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE="$PWD/android/purelive-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ]; then

            echo "✅ 使用 GitHub Secrets 固定签名"

            KEYSTORE_PATH="$KEYSTORE" \
            KEYSTORE_BASE64="$KEYSTORE_BASE64" \
            python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["KEYSTORE_BASE64"]
          path = Path(os.environ["KEYSTORE_PATH"])

          path.write_bytes(
              base64.b64decode(raw)
          )
          PY
          else
            echo "⚠️ 未设置固定 Android 签名"
            echo "⚠️ 生成临时签名"

            STORE_PASSWORD="PureLiveAutoBuild"
            KEY_PASSWORD="PureLiveAutoBuild"
            KEY_ALIAS="purelive"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PureLive AutoBuild, OU=Personal, O=PureLive, C=CN"
          fi

          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: CI 禁用所有 Android Lint 任务
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.tasks.configureEach { task ->
                  def n = task.name.toLowerCase()
                  if (n.startsWith("lint")) {
                      task.enabled = false
                  }
              }
          }
          GRADLE

          echo "✅ 仅在 GitHub Actions 构建环境禁用 lint* 任务"
          echo "✅ 不修改 Pure Live Android 源码"

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get

      - name: 获取版本号
        id: app_version
        working-directory: source
        shell: bash
        run: |
          set -e

          FULL_VERSION=$(grep '^version:' pubspec.yaml \
            | head -n 1 \
            | sed 's/version:[[:space:]]*//')

          VERSION="${FULL_VERSION%%+*}"

          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 编译 Android APK
        working-directory: source
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "======================================"
          echo "Android：macOS Runner（跟随官方构建环境）"
          echo "Lint：CI-only 全局跳过"
          echo "======================================"

          set +e

          flutter build apk \
            --release \
            --split-per-abi \
            2>&1 | tee android-first-build.log

          FIRST_EXIT=${PIPESTATUS[0]}

          set -e

          if [ "$FIRST_EXIT" -eq 0 ]; then
            echo "✅ Android 第一次构建成功"

          elif grep -Fq \
            "File modified during build. Build must be rerun." \
            android-first-build.log; then

            echo ""
            echo "⚠️ FFmpegKit 首次准备完成，自动第二次构建"

            flutter build apk \
              --release \
              --split-per-abi

          else
            echo ""
            echo "❌ Android 构建失败"
            echo ""
            echo "========== 最后 160 行 =========="
            tail -n 160 android-first-build.log
            echo "================================="
            exit "$FIRST_EXIT"
          fi

      - name: 整理 Android APK
        working-directory: source
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.app_version.outputs.version }}"

          mkdir -p release-android

          COUNT=0

          for APK in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$APK" ] || continue

            BASENAME=$(basename "$APK")

            case "$BASENAME" in
              *armeabi-v7a*)
                ARCH="arm32-v7a"
                ;;
              *arm64-v8a*)
                ARCH="arm64-v8a"
                ;;
              *x86_64*)
                ARCH="x86_64"
                ;;
              *)
                ARCH="universal"
                ;;
            esac

            cp "$APK" \
              "release-android/PureLive-${VERSION}-Custom-Twitch-SOOP-Android-${ARCH}.apk"

            COUNT=$((COUNT + 1))
          done

          if [ "$COUNT" -lt 1 ]; then
            echo "❌ 没找到 Android APK"
            exit 1
          fi

          ls -lh release-android

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Android-${{ needs.prepare.outputs.tag }}
          path: source/release-android/*.apk
          retention-days: 30
          if-no-files-found: error

  build-windows:
    name: 编译 Windows x64
    needs:
      - prepare
      - preflight
    if: >-
      ${{
        needs.prepare.outputs.should_build == 'true' &&
        (
          needs.prepare.outputs.target == 'all' ||
          needs.prepare.outputs.target == 'windows'
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: 下载已预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Official-AW-CustomSites-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: pwsh
        run: |
          tar -xzf `
            "prevalidated/pure-source-official-custom-sites-aw.tar.gz"

          if (-not (Test-Path "source/windows")) {
            throw "官方 Windows 工程不存在"
          }

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: pwsh
        run: |
          $version = ""

          if (Test-Path "source/.fvmrc") {
            try {
              $data = Get-Content `
                "source/.fvmrc" `
                -Raw |
                ConvertFrom-Json

              $version = "$($data.flutter)".Trim()
            }
            catch {
              $version = ""
            }
          }

          if (-not $version) {
            $version = "3.47.0"
          }

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      - name: 安装官方 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 启用 Flutter Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: 获取 Flutter 依赖
        working-directory: source
        shell: pwsh
        run: |
          flutter clean
          flutter pub get

      - name: 安装 Fastforge 和 Inno Setup
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            https://github.com/SlotSun/fastforge.git `
            fastforge

          Push-Location fastforge
          dart pub global activate melos
          melos run activate
          Pop-Location

          choco install innosetup `
            -y `
            --no-progress

      - name: 复制 Inno Setup 中文语言包
        working-directory: source
        shell: pwsh
        run: |
          $sourceFile = `
            "windows\packaging\exe\ChineseSimplified.isl"

          $targetFile = `
            "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

          if (Test-Path $sourceFile) {
            Copy-Item `
              $sourceFile `
              $targetFile `
              -Force
          }

      - name: 获取版本号
        id: app_version
        working-directory: source
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml |
            Where-Object {
              $_ -match '^\s*version:\s*(\S+)'
            } |
            Select-Object -First 1

          if (-not $line) {
            throw "无法读取 pubspec.yaml version"
          }

          $full = (
            $line -replace '^\s*version:\s*', ''
          ).Trim()

          $version = (
            $full -split '\+'
          )[0]

          "full=$full" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      - name: 打包 Windows EXE + ZIP
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          & fastforge package `
            --platform windows `
            --targets exe,zip `
            --skip-clean `
            2>&1 | Tee-Object `
              -FilePath "windows-first-build.log"

          $firstExit = $LASTEXITCODE

          $ErrorActionPreference = "Stop"

          if ($firstExit -eq 0) {
            Write-Host "✅ Windows 第一次构建成功"
          }
          else {
            $log = Get-Content `
              "windows-first-build.log" `
              -Raw

            if (
              $log -match
              "File modified during build\. Build must be rerun\."
            ) {
              Write-Host "⚠️ FFmpegKit 首次准备完成，自动第二次构建"

              & fastforge package `
                --platform windows `
                --targets exe,zip `
                --skip-clean

              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
            else {
              exit $firstExit
            }
          }

      - name: 整理 Windows 文件
        working-directory: source
        shell: pwsh
        run: |
          $VERSION = "${{ steps.app_version.outputs.version }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-windows" |
            Out-Null

          $exe = Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "没有找到 Fastforge 生成的 EXE"
          }

          Copy-Item `
            $exe.FullName `
            "release-windows\PureLive-$VERSION-Custom-Twitch-SOOP-Windows-x64-Setup.exe" `
            -Force

          $zip = Get-ChildItem `
            -Path "dist" `
            -Recurse `
            -Filter "*.zip" |
            Select-Object -First 1

          if (-not $zip) {
            throw "没有找到 Fastforge 生成的 ZIP"
          }

          Copy-Item `
            $zip.FullName `
            "release-windows\PureLive-$VERSION-Custom-Twitch-SOOP-Windows-x64-Portable.zip" `
            -Force

      - name: 上传 Windows EXE + ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Windows-${{ needs.prepare.outputs.tag }}
          path: |
            source/release-windows/*.exe
            source/release-windows/*.zip
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: 发布所选平台 GitHub Release
    needs:
      - prepare
      - build-android
      - build-windows
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.should_build == 'true' &&
        (
          (
            needs.prepare.outputs.target == 'android' &&
            needs.build-android.result == 'success'
          ) ||
          (
            needs.prepare.outputs.target == 'windows' &&
            needs.build-windows.result == 'success'
          ) ||
          (
            needs.prepare.outputs.target == 'all' &&
            needs.build-android.result == 'success' &&
            needs.build-windows.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 Android APK
        if: >-
          ${{
            needs.prepare.outputs.target == 'all' ||
            needs.prepare.outputs.target == 'android'
          }}
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Android-${{ needs.prepare.outputs.tag }}
          path: release-assets/android

      - name: 下载 Windows EXE + ZIP
        if: >-
          ${{
            needs.prepare.outputs.target == 'all' ||
            needs.prepare.outputs.target == 'windows'
          }}
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-Windows-${{ needs.prepare.outputs.tag }}
          path: release-assets/windows

      - name: 检查本次 Release Assets
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ needs.prepare.outputs.target }}"

          APK_COUNT=0
          EXE_COUNT=0
          ZIP_COUNT=0

          if [ -d release-assets/android ]; then
            APK_COUNT=$(find release-assets/android \
              -type f -name "*.apk" | wc -l)
          fi

          if [ -d release-assets/windows ]; then
            EXE_COUNT=$(find release-assets/windows \
              -type f -name "*.exe" | wc -l)

            ZIP_COUNT=$(find release-assets/windows \
              -type f -name "*.zip" | wc -l)
          fi

          echo "TARGET=$TARGET"
          echo "APK=$APK_COUNT"
          echo "EXE=$EXE_COUNT"
          echo "ZIP=$ZIP_COUNT"

          case "$TARGET" in
            android)
              [ "$APK_COUNT" -ge 1 ]
              ;;
            windows)
              [ "$EXE_COUNT" -ge 1 ]
              [ "$ZIP_COUNT" -ge 1 ]
              ;;
            all)
              [ "$APK_COUNT" -ge 1 ]
              [ "$EXE_COUNT" -ge 1 ]
              [ "$ZIP_COUNT" -ge 1 ]
              ;;
          esac

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM="${{ needs.prepare.outputs.tag }}"
          RELEASE_TAG="${{ needs.prepare.outputs.release_tag }}"
          TARGET="${{ needs.prepare.outputs.target }}"

          cat > release-notes.md <<EOF
          根据上游 liuchuancong/pure_live ${UPSTREAM} 自动构建。

          本次目标平台：${TARGET}

          - Android：官方 Android 工程；GitHub Actions 使用 macOS Runner
          - Android：CI-only 禁用 lint* 任务，避免 Android Lint 内部异常阻断打包
          - Windows：官方 Windows 工程 + Fastforge
          - Twitch：自定义无弹幕实现
          - SOOP：自定义播放/Cookie 实现
          - SOOP：关注页直播封面 V2
          - SOOP：热门页补 profile_img 头像
          - 不修改官方 Sites.supportSites

          这是 GitHub Actions 自动构建的 Pre-release。
          EOF

          mapfile -t ASSETS < <(
            find release-assets \
              -type f \
              \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) \
              -print
          )

          if [ "${#ASSETS[@]}" -lt 1 ]; then
            echo "❌ 没有 Release Assets"
            exit 1
          fi

          if gh release view \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            gh release upload \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --clobber \
              --repo "${{ github.repository }}"

            gh release edit \
              "$RELEASE_TAG" \
              --title "Pure Live ${UPSTREAM} Android + Windows + 自定义 Twitch / SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --repo "${{ github.repository }}"
          else
            gh release create \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --title "Pure Live ${UPSTREAM} Android + Windows + 自定义 Twitch / SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi

          echo "✅ Release 已更新：$RELEASE_TAG"
