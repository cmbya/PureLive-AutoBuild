name: Pure Live 每日自动更新 - 官方 iOS + 自定义 Twitch SOOP

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:
    inputs:
      version:
        description: "Pure Live 版本：latest 或指定版本，例如 v2.1.1"
        required: true
        default: "latest"
        type: string

      force_build:
        description: "即使这个版本已经编译过，也强制重新编译"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: purelive-ios-official-custom-sites
  cancel-in-progress: false

jobs:
  prepare:
    name: 每日检查 Pure Live 更新
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: 检查上游版本和本仓库 Release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED="${{ inputs.version }}"
            FORCE="${{ inputs.force_build }}"
          else
            REQUESTED="latest"
            FORCE="false"
          fi

          if [ "$REQUESTED" = "latest" ]; then
            TAG=$(gh api \
              repos/liuchuancong/pure_live/releases/latest \
              --jq '.tag_name')
          else
            TAG="$REQUESTED"
          fi

          RELEASE_TAG="autobuild-ios-${TAG}"

          echo "======================================"
          echo "Pure Live 上游版本：$TAG"
          echo "本仓库 Release Tag：$RELEASE_TAG"
          echo "======================================"

          SHOULD_BUILD="true"

          if [ "$FORCE" != "true" ]; then
            if gh release view \
              "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then

              SHOULD_BUILD="false"

              echo ""
              echo "✅ Release 已存在：$RELEASE_TAG"
              echo "✅ 当前上游版本已经成功编译过"
              echo "✅ 今天不启动 macOS 编译 Runner"
            else
              echo ""
              echo "🆕 当前版本还没有对应 Release"
              echo "🆕 开始执行快速预检"
            fi
          else
            echo ""
            echo "⚠️ force_build=true"
            echo "⚠️ 强制重新预检和编译 $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  no-update:
    name: 没有更新
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 今日无需编译
        shell: bash
        run: |
          echo "✅ Pure Live 当前仍是 ${{ needs.prepare.outputs.tag }}"
          echo "✅ 对应 iOS Release 已存在"
          echo "✅ 今日不启动昂贵的 macOS Runner"

  preflight:
    name: 官方结构 + 自定义 Twitch SOOP 预检
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下载 AutoBuild 仓库
        uses: actions/checkout@v4

      - name: 下载 Pure Live 官方源码
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch "${{ needs.prepare.outputs.tag }}" \
            https://github.com/liuchuancong/pure_live.git \
            source

      - name: 检查官方 2.1.1+ 平台注册
        shell: bash
        run: |
          set -e

          echo "========== 官方 Sites.supportSites =========="
          grep -n -E \
            "twitchSite|soopSite|iptvSite|TwitchSite|SoopSite|IptvSite" \
            source/lib/core/sites.dart \
            || true
          echo "=============================================="

          grep -q "TwitchSite()" source/lib/core/sites.dart
          grep -q "SoopSite()" source/lib/core/sites.dart

          echo "✅ 官方源码已经注册 Twitch"
          echo "✅ 官方源码已经注册 SOOP"
          echo "✅ 不再运行旧的 sites.dart 注册补丁"

      - name: Twitch 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_twitch.py \
            --hash-output twitch_hashes.json

      - name: SOOP 真实网络预检
        shell: bash
        run: |
          set -e

          python3 scripts/preflight_soop.py

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: bash
        run: |
          set -e

          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/.fvmrc")

          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              print(data.get("flutter", "").strip())
          PY
          )

          if [ -z "$VERSION" ]; then
            VERSION="3.47.0"
            echo "ℹ️ 上游没有可读取的 .fvmrc，回退到 $VERSION"
          else
            echo "✅ 使用上游 .fvmrc Flutter：$VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装与官方一致的 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 仅提取自定义 Twitch / SOOP 实现
        shell: bash
        run: |
          set -e

          python3 scripts/extract_custom_sites_v211.py \
            source \
            --hashes twitch_hashes.json \
            --patch-twitch scripts/patch_twitch.py \
            --twitch-template patches/twitch_site.dart.tpl \
            --patch-soop scripts/patch_soop.py \
            --soop-template patches/soop_site.dart.tpl \
            --soop-auth-template patches/soop_account_settings_page.dart.tpl

      - name: 强制验证 SOOP 关注页封面代码
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/lib/core/site/soop_site.dart")
          text = path.read_text(encoding="utf-8")

          start = text.find("Future<LiveRoom> getRoomDetail")
          if start < 0:
              raise SystemExit("❌ 找不到 SOOP getRoomDetail()")

          end = text.find("@override", start + 20)
          if end < 0:
              end = min(len(text), start + 5000)

          block = text[start:end]

          checks = {
              "V2 marker": "CMBYA_SOOP_FOLLOW_COVER_V2" in block,
              "direct cover": "final directCover =" in block,
              "BNO cover URL": "https://liveimg.sooplive.com/m/$bno" in block,
              "LiveRoom cover": "cover: cover," in block,
              "旧空封面已删除": "cover: ''," not in block,
          }

          for name, ok in checks.items():
              print(("✅" if ok else "❌"), name)

          if not all(checks.values()):
              print("")
              print("========== getRoomDetail 实际内容 ==========")
              print(block)
              print("============================================")
              raise SystemExit(
                  "❌ SOOP 关注页封面修复没有真正进入最终源码，停止编译"
              )

          print("")
          print("✅ SOOP 关注页封面修复 V2 已真正进入最终源码")
          PY

      - name: 获取官方 Flutter 依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          rm -rf .dart_tool build
          flutter clean
          flutter pub get

      - name: 格式化两个自定义 Site
        working-directory: source
        shell: bash
        run: |
          set -e

          dart format \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart

      - name: Dart 快速静态检查
        working-directory: source
        shell: bash
        run: |
          set -e

          dart analyze \
            --no-fatal-warnings \
            lib/core/site/twitch_site.dart \
            lib/core/site/soop_site.dart \
            lib/core/sites.dart

      - name: 最终确认官方 iOS 未被修改
        shell: bash
        run: |
          set -e

          echo "✅ 本流程没有运行 patch_pure_ios.py"
          echo "✅ 本流程没有关闭 Swift Package Manager"
          echo "✅ 本流程没有删除 share_handler"
          echo "✅ 本流程没有改 Podfile / ShareExtension"
          echo "✅ 本流程没有改 Sites.supportSites"
          echo "✅ 只覆盖 TwitchSite / SoopSite 两个 Dart 实现"

      - name: 准备已预检源码
        shell: bash
        run: |
          set -e

          rm -rf source/.dart_tool
          rm -rf source/build
          rm -rf source/.git

          tar -czf pure-source-official-ios-custom-sites.tar.gz source

          ls -lh pure-source-official-ios-custom-sites.tar.gz

      - name: 上传已预检源码
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Official-iOS-CustomSites-Source-${{ needs.prepare.outputs.tag }}
          path: pure-source-official-ios-custom-sites.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-ios:
    name: 按官方 iOS 工程编译
    needs:
      - prepare
      - preflight
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: 下载已预检源码
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Official-iOS-CustomSites-Source-${{ needs.prepare.outputs.tag }}
          path: prevalidated

      - name: 解压源码
        shell: bash
        run: |
          set -e

          tar -xzf \
            prevalidated/pure-source-official-ios-custom-sites.tar.gz

          test -f source/lib/core/site/twitch_site.dart
          test -f source/lib/core/site/soop_site.dart
          test -d source/ios/Runner

          echo "✅ 使用 Pure Live 官方 iOS 工程"

      - name: 读取官方 Flutter 版本
        id: flutter_version
        shell: bash
        run: |
          set -e

          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("source/.fvmrc")

          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              print(data.get("flutter", "").strip())
          PY
          )

          if [ -z "$VERSION" ]; then
            VERSION="3.47.0"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Flutter：$VERSION"

      - name: 安装与官方一致的 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: 查看官方编译环境
        shell: bash
        run: |
          set -e

          flutter --version
          dart --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "========== iOS targets =========="
          xcodebuild \
            -project source/ios/Runner.xcodeproj \
            -list

      - name: 获取官方依赖
        working-directory: source
        shell: bash
        run: |
          set -e

          flutter clean
          flutter pub get

      - name: 编译官方无签名 iOS
        working-directory: source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "只使用官方 iOS 工程编译"
          echo "不删除 share_handler"
          echo "不禁用 SwiftPM"
          echo "不修改 Podfile / ShareExtension"
          echo "======================================"

          flutter build ios \
            --release \
            --no-codesign

      - name: 检查 Runner.app
        shell: bash
        run: |
          set -e

          APP="source/build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "❌ Runner.app 不存在"
            exit 1
          fi

          echo "✅ Runner.app 编译成功"
          du -sh "$APP"

          echo ""
          if [ -d "$APP/PlugIns" ]; then
            echo "✅ 官方 Runner.app 含 PlugIns / App Extension"
            find "$APP/PlugIns" -maxdepth 2 -type d -print
          else
            echo "ℹ️ 官方 Runner.app 当前没有 PlugIns"
          fi

      - name: 制作两个 IPA
        shell: bash
        run: |
          set -e

          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          APP="source/build/ios/iphoneos/Runner.app"

          rm -rf package-official package-livecontainer
          mkdir -p package-official/Payload
          mkdir -p package-livecontainer/Payload

          # 1) 官方结构：完整保留 PlugIns / ShareExtension
          cp -R "$APP" package-official/Payload/

          (
            cd package-official
            zip -qry \
              "../PureLive-${VERSION}-Custom-Twitch-SOOP-iOS-Official-Unsigned.ipa" \
              Payload
          )

          # 2) LiveContainer：只在最终副本里去掉 App Extension。
          #    注意：源码和官方编译过程都没有被改。
          cp -R "$APP" package-livecontainer/Payload/
          rm -rf package-livecontainer/Payload/Runner.app/PlugIns

          (
            cd package-livecontainer
            zip -qry \
              "../PureLive-${VERSION}-Custom-Twitch-SOOP-iOS-LiveContainer.ipa" \
              Payload
          )

          echo ""
          echo "========== IPA =========="
          ls -lh PureLive-*.ipa

      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-iOS-${{ needs.prepare.outputs.tag }}
          path: PureLive-*.ipa
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: 发布 iOS GitHub Release
    needs:
      - prepare
      - build-ios
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: PureLive-Custom-Twitch-SOOP-iOS-${{ needs.prepare.outputs.tag }}
          path: release-assets

      - name: 检查 Release Assets
        shell: bash
        run: |
          set -e

          echo "========== iOS Assets =========="
          find release-assets -type f -name "*.ipa" -print

          IPA_COUNT=$(find release-assets -type f -name "*.ipa" | wc -l)

          if [ "$IPA_COUNT" -lt 2 ]; then
            echo "❌ 预期应有 2 个 IPA"
            exit 1
          fi

      - name: 创建或更新 iOS Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          UPSTREAM="${{ needs.prepare.outputs.tag }}"
          RELEASE_TAG="${{ needs.prepare.outputs.release_tag }}"

          cat > release-notes.md <<EOF
          根据上游 liuchuancong/pure_live ${UPSTREAM} 自动构建。

          - iOS 工程：完整沿用上游官方 iOS 工程
          - 不再运行旧 patch_pure_ios.py
          - 不删除 share_handler
          - 不禁用 Swift Package Manager
          - 不修改 Podfile / ShareExtension
          - 不修改官方 Sites.supportSites
          - 自定义部分：仅替换 TwitchSite 与 SoopSite
          - Twitch：使用自己的无弹幕实现
          - SOOP：使用自己的实现，并复用官方本地账号/Cookie设置
          - 构建前执行 Twitch / SOOP 真实网络预检

          Assets：
          - Official-Unsigned：完整保留官方 App Extension
          - LiveContainer：仅在最终 IPA 副本中去掉 PlugIns，方便 LiveContainer 使用

          这是 GitHub Actions 自动构建的 Pre-release。
          EOF

          mapfile -t ASSETS < <(
            find release-assets \
              -type f \
              -name "*.ipa" \
              -print
          )

          if gh release view \
            "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            gh release upload \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --clobber \
              --repo "${{ github.repository }}"

            gh release edit \
              "$RELEASE_TAG" \
              --title "Pure Live ${UPSTREAM} 官方 iOS + 自定义 Twitch / SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --repo "${{ github.repository }}"
          else
            gh release create \
              "$RELEASE_TAG" \
              "${ASSETS[@]}" \
              --title "Pure Live ${UPSTREAM} 官方 iOS + 自定义 Twitch / SOOP" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false \
              --target "${{ github.sha }}" \
              --repo "${{ github.repository }}"
          fi

          echo ""
          echo "======================================"
          echo "✅ iOS Release 已发布"
          echo "Release：$RELEASE_TAG"
          echo "======================================"
